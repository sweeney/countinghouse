# The property this instance serves.
#
#   id                 the site's id in the `sites` namespace. Reported on /healthz and
#                      named in the startup log; nothing cross-checks it against that
#                      namespace, so a wrong id is visible rather than rejected.
#   devices_namespace  the config namespace holding this site's devices. REQUIRED —
#                      the service refuses to start without it. It briefly defaulted to
#                      the shared pre-split namespace, which has since been deleted, so
#                      the default came to name a 404.
#
# Both are given explicitly. devices_namespace is deliberately not derived from id: a
# namespace is a document that either exists or does not, so guessing `devices_<id>`
# would turn a typo in id into a 404, a fail-open empty snapshot, and every endpoint
# honestly reporting zero devices — every bill and every series answering zero rather
# than erroring. Naming no namespace is refused at startup for the same reason. The
# mirror case (a namespace with no id) only warns: it serves correct numbers and merely
# cannot say which property they belong to.
#   floorplan_namespace  the config namespace holding this site's floor and room
#                      records — the same document greenhouse reads. Published by
#                      /floors and /rooms, and used to label grouped series with
#                      names instead of ids. The document holds ARRAYS, unlike the
#                      devices namespace's map keyed by id:
#                        {"floors": [{"id": "floor1", "name": "Floor One",
#                                     "order": 1, "elevation": 0.0}, ...],
#                         "rooms":  [{"id": "floor1.room-a", "name": "Room A",
#                                     "floor": "floor1", "category": "utility",
#                                     "area": 12.4}, ...]}
#                      (the devices-style {"<id>": {...}} form is also accepted, and
#                      carries floors only). REQUIRED, like devices_namespace — the
#                      service refuses to start without it. Unnamed, nothing fails:
#                      /floors and /rooms still list every floor and room holding a
#                      metered device, and every kWh and cost is exactly right. Only
#                      the NAMES are lost, so the endpoints answer with ids where
#                      labels belong and null where storey order belongs — which is
#                      indistinguishable from a floorplan publishing nothing, and
#                      surfaces days later as a legend reading "floor1.room-c" to a
#                      human. Declared or refused; there is no quiet middle.
site:
  id: home
  devices_namespace: devices_home
  floorplan_namespace: floorplan_home

# Countinghouse local configuration.
# Device inventory and tariffs are fetched from the remote config service
# (config.swee.net) and are NOT defined here.

http:
  listen: ":8585"
  public_url: "https://countinghouse.swee.net"

influx:
  url: "http://garibaldi:8086"
  org: "swee.net"
  bucket: "statehouse"
  # Supply the read token inline, or point token_file at a file containing
  # it (token_file is read only when token is empty).
  token: ""
  token_file: "/etc/countinghouse/influx-token"

identity:
  base_url: "https://id.swee.net"
  client_id: "countinghouse"
  client_secret: "REPLACE_ME"

remote_config:
  base_url: "https://config.swee.net"

  # Dated-tariff namespace. Leave UNSET to keep using the legacy `energy_tariffs`
  # single-rate document; set it to opt in to dated agreements, which is what a
  # half-hourly (variable) tariff requires.
  #
  # The two are never merged — exactly one document is authoritative, and
  # /healthz and GET /tariffs both report which. When set, the namespace is
  # required: a named namespace that has never been fetched aborts startup rather
  # than quietly falling back to the legacy rate, because falling back would
  # price a variable tariff at a fixed number.
  # agreements_namespace: "energy_agreements"

prices:
  # The half-hourly price archive: the one thing countinghouse writes.
  #
  # Leave UNSET for a deployment whose tariff agreements are all flat-rate — it has
  # no half-hourly prices to keep, and the collector simply does not run. Set it as
  # soon as any agreement is `variable`: startup REFUSES that combination, because
  # a half-hourly agreement with nowhere to store prices can price nothing, and the
  # service would otherwise look healthy while failing every window after the
  # switchover.
  #
  # The parent directory must exist and be writable by the service user. The file is
  # created mode 0600, as are the -wal and -shm files SQLite keeps beside it. Back
  # it up: it is rebuildable from the supplier today, and the whole reason to keep
  # it is the day that stops being true.
  db_path: "/var/lib/countinghouse/prices.db"

house:
  timezone: "Europe/London"
