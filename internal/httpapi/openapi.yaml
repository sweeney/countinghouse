openapi: 3.0.3
info:
  title: Countinghouse API
  description: >
    Read-side energy cost/accounting HTTP API. Turns per-device telemetry into
    windowed kWh and cost. All endpoints except /healthz and /openapi.json
    require a Bearer JWT (user or service token) issued by the configured
    identity service.
  version: "0.2.0"
  contact:
    name: Martin Sweeney
    email: martin@sweeney.io
    url: https://github.com/sweeney/countinghouse
  license:
    name: Proprietary
    url: https://github.com/sweeney/countinghouse
servers:
  - url: __PUBLIC_URL__

security:
  - bearerAuth: []

tags:
  - name: data
    description: Energy, cost, bill, series and event endpoints (require a Bearer JWT).
  - name: prices
    description: >
      Half-hourly spot prices: the archive, the forward curve, and the cheapest
      window for a deferrable load.
  - name: system
    description: Health and API spec endpoints.

# Every response carries permissive CORS headers (Access-Control-Allow-Origin: *)
# and Timing-Allow-Origin: *, so browser consumers on any origin can call the API
# and read real PerformanceResourceTiming phases rather than zeroed ones. Safe as
# a wildcard because the API authenticates by Bearer token, not cookies.

paths:
  /healthz:
    get:
      summary: Health check
      description: Returns server health, Influx reachability, and (later) remote config fetch status. No auth required.
      operationId: getHealth
      security: []
      tags: [system]
      responses:
        "200":
          description: Server is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /openapi.json:
    get:
      summary: OpenAPI spec
      description: This spec document, as JSON. No auth required.
      operationId: getOpenAPISpec
      security: []
      tags: [system]
      responses:
        "200":
          description: OpenAPI 3.0 spec
          content:
            application/json:
              schema:
                type: object

  /devices/{id}/energy:
    get:
      summary: Device energy
      description: >
        Windowed kWh consumed by one device. Routing is class-derived: plug
        classes use the reset-safe counter path (source "counter"); ups_sensor
        uses the power integral (source "integral"). Non-metered classes return
        400.
      operationId: getDeviceEnergy
      tags: [data]
      parameters:
        - $ref: "#/components/parameters/DeviceID"
        - $ref: "#/components/parameters/Window"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Windowed energy for the device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceEnergyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /devices/{id}/cost:
    get:
      summary: Device cost
      description: >
        Windowed kWh and VAT-inclusive GBP cost for one device.


        How the cost is derived depends on the tariff(s) covering the window, and
        `attribution` says which was used. Under a FIXED tariff it is kWh x the unit
        rate (`attribution: flat_rate`). Under a HALF-HOURLY tariff there is no single
        unit rate, so each half hour's energy is priced at that half hour's own
        published rate and summed (`attribution: counter_slot`); `tariff` is then
        absent, because reporting a representative rate would be read as the price.
        A window spanning a tariff change prices each side on its own tariff, with
        its own VAT rate.


        `effective_rate` is the VAT-inclusive GBP/kWh actually paid. It is the number
        that makes a slot-priced figure interpretable — whether this device ran cheap
        or dear against the day — and for a low-draw device over a single day it
        carries a few percent of quantisation noise, because plug counters tick in
        0.1 kWh steps that land in whichever half hour reported them. Rates of either
        SIGN are normal: negative half-hourly prices produce a credit.


        `unpriced_kwh` is energy in half hours no rate is held for. It is NOT included
        in `cost` and is absent when zero — its presence means the answer is
        incomplete, never that the energy was free.
      operationId: getDeviceCost
      tags: [data]
      parameters:
        - $ref: "#/components/parameters/DeviceID"
        - $ref: "#/components/parameters/Window"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Windowed cost for the device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceCostResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"

  /series:
    get:
      summary: Energy time-series
      description: >
        Multi-series energy time-series over the window: per-series kWh, cost and
        avg_w. group_by selects device (default, one series per metered device,
        excluding the whole-house meter), room, floor, class, or house. A floor is
        the sum of its rooms — energy is additive, so sum is the only combining
        statistic and there is no group_fn. Grouped place series (room, floor) are
        labelled with the floorplan's NAME when it publishes one and by their id
        otherwise; the key is always the id. rooms= and floors= narrow which
        devices the response covers. house yields
        three series in order: "monitored" = sum of devices, "unmonitored" =
        clamp(meter − monitored) per bucket (the rest-of-home energy no monitored
        device accounts for), and "meter" = the whole-house meter. Stacking every
        series except "meter" reconstructs the whole home; monitored + unmonitored
        == meter per bucket within rounding tolerance (a slightly-negative residual
        from counter quantisation clamps to 0). unmonitored cost is the tariff
        applied to its clamped energy. The house response also carries top-level
        coverage (monitored ÷ meter) and a stale-monitored-device indicator
        (count + ids) so consumers can gauge how trustworthy the split is. For
        device/room/class groupings, include_unmonitored=true adds the same
        rest-of-home quantity as a single catch-all series so those parts sum to
        the meter too. The shape param chooses columnar (default) or row-oriented
        output.
      operationId: getSeries
      tags: [data]
      parameters:
        - $ref: "#/components/parameters/Window"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Interval"
        - $ref: "#/components/parameters/GroupBy"
        - $ref: "#/components/parameters/RoomsFilter"
        - $ref: "#/components/parameters/FloorsFilter"
        - $ref: "#/components/parameters/IncludeUnmonitored"
        - $ref: "#/components/parameters/Unclamped"
        - $ref: "#/components/parameters/WithPrices"
        - $ref: "#/components/parameters/Shape"
      responses:
        "200":
          description: >
            Energy time-series. shape=columns → SeriesResponse (shared buckets
            axis + per-series arrays); shape=rows → RowsResponse (flat rows).
          headers:
            Cache-Control:
              $ref: "#/components/headers/WindowCacheControl"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SeriesResponse"
                  - $ref: "#/components/schemas/RowsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"

  /devices/{id}/series:
    get:
      summary: Device energy time-series
      description: >
        Single-device convenience form of /series: the same response shapes
        carrying exactly one series for the device. Non-metered classes return
        400. Every energy-capable device in /devices is served, INCLUDING the
        whole-house meter: it is excluded from /series?group_by=device because
        it would double-count against the plugs it measures, but a request for a
        single device cannot double-count, and its series here is identical to
        the "meter" series of group_by=house. The response always carries exactly
        one series and group_by reads "device"; a build that produced none is an
        internal inconsistency and returns 500 rather than 200 with an empty
        series list. The shape param chooses columnar (default) or row-oriented
        output. rooms= and floors= are IGNORED here rather than rejected: they
        SELECT devices, and the path segment has already selected one, so they are
        redundant rather than contradictory (matching greenhouse's single-device
        endpoint).
        The reserved id "unmonitored" is a synthetic device serving the house
        "unmonitored" series (rest of home = clamp(meter − monitored)) through this
        same single-series shape; it returns 404 when no whole-house meter is
        configured (unmonitored is then undefined). For id=unmonitored the
        unclamped diagnostic param applies (ignored for real devices).
        Its body is the SAME schema as a real device's: coverage,
        stale_monitored_count and stale_monitored_ids are absent here too, even
        though deriving unmonitored requires the whole-house decomposition. Those
        signals describe that decomposition rather than this series, and
        GET /series?group_by=house carries them beside the identical unmonitored
        values for a consumer that wants both.
      operationId: getDeviceSeries
      tags: [data]
      parameters:
        - $ref: "#/components/parameters/DeviceID"
        - $ref: "#/components/parameters/Window"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Interval"
        - $ref: "#/components/parameters/Unclamped"
        - $ref: "#/components/parameters/WithPrices"
        - $ref: "#/components/parameters/Shape"
      responses:
        "200":
          description: >
            Energy time-series for the device. shape=columns → SeriesResponse;
            shape=rows → RowsResponse.
          headers:
            Cache-Control:
              $ref: "#/components/headers/WindowCacheControl"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SeriesResponse"
                  - $ref: "#/components/schemas/RowsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"

  /bill:
    get:
      summary: Electricity bill
      description: >
        Per-device cost breakdown plus standing charge, total, and
        reconciliation against the whole-house meter for the window.


        SCOPE MATTERS HERE. `energy_cost` is the sum of the device rows and
        `total` is that plus the standing charge, so BOTH exclude the unmonitored
        remainder. On a home where the meter sees twice what the plugs do, quoting
        `total` understates the household bill by half. `scope` names what they
        cover, and `household_energy_cost` / `household_total` give the whole-home
        figures beside them. The existing fields are unchanged — a silent
        numerical change to `total` would be worse than the ambiguity it fixes.


        Energy is priced as for /devices/{id}/cost, and `attribution` reports how:
        `flat_rate` under a single fixed tariff, `counter_slot` when any part of the
        window is half-hourly (each half hour's energy at that half hour's rate). The
        per-device costs sum exactly to `energy_cost` either way.


        The standing charge is reported ONCE, on the bill, and is never apportioned
        across devices: no device causes it, so splitting it would invent a number
        that reads like a measurement. It is apportioned across TARIFF SEGMENTS
        instead — a window spanning a switchover is charged each side's daily rate for
        its own days — and a partial day is billed pro rata rather than rounded up.
      operationId: getBill
      tags: [data]
      parameters:
        - $ref: "#/components/parameters/Window"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Assembled bill
          headers:
            Cache-Control:
              $ref: "#/components/headers/WindowCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /compare:
    get:
      summary: What this window would have cost under an alternative
      description: >
        Prices the window as it actually was, and again under one or more
        counterfactuals, returning both plus the difference per component.


        It exists because "what would this have cost under X?" was the question
        nearly every consumer was really asking, and each of them hand-rolled it.
        Five hand-rolls in one session produced two baseline errors — comparing
        against a tariff that had already EXPIRED, and omitting the
        STANDING-CHARGE difference. Both are errors a server-side primitive makes
        structurally hard: `available_now` is a labelled field rather than a
        silence, and `delta` is split so the standing charge has its own
        component and the totals will not reconcile without it.


        The service already holds the dated agreements, the price curve and the
        consumption. The client supplies only the alternative.


        The baseline runs through the same path /bill runs, so a comparison and a
        bill cannot disagree about what actually happened. A window spanning a
        tariff change is fine here, as on /bill: a cost can be summed across
        tariffs where a curve cannot.
      operationId: getCompare
      tags: [data]
      parameters:
        - $ref: "#/components/parameters/Window"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: scope
          in: query
          required: true
          description: >
            Which load to compare over. REQUIRED, with no default.


            On one measured window the same question answered -0.4% at
            `household` scope and -31.8% at `monitored`: automation doing
            excellent work on the load it controls, swamped at whole-house level
            by unmonitored evening cooking. Both numbers are correct and they
            support opposite conclusions, so a default would pick one silently,
            once, for every caller, forever. The friction is the point.


            `household` needs a whole-house meter; without one it is a 400
            naming `monitored` as the alternative, rather than quietly answering
            from the monitored devices and relabelling a partial figure.
          schema:
            type: string
            enum: [household, monitored]
        - name: alt
          in: query
          required: true
          description: >
            The counterfactual to compare against, as `kind` or `kind:k=v,k=v`.
            REPEATABLE — five counterfactuals should be one call, not five.


            `window_mean` — the same kWh spread flat across this window's own
            prices. No parameters. The standing charge is unchanged, so the whole
            difference is load shape: this is the number that says whether
            shifting load actually paid. The mean is TIME-weighted; an
            energy-weighted one is the effective rate already paid, so comparing
            against it would always report level and answer nothing.


            `tariff:id=<code or name>` — a dated agreement this service already
            holds. Sets `available_now`. A half-hourly agreement is a 501:
            comparing against it needs that tariff's own archived curve, and the
            collector archives only the tariff this site is on.


            `flat:unit_rate=&daily_standing_charge=&vat_rate=&label=` — rates the
            caller supplies, for a quote that exists only on a letter. Rates are
            ex-VAT, matching /tariffs. All three numbers are REQUIRED; see the
            400 below.
          schema:
            type: array
            items:
              type: string
          examples:
            windowMean:
              value: ["window_mean"]
            namedTariff:
              value: ["tariff:id=E-1R-VAR-22-11-01-C"]
            renewalQuote:
              value: ["flat:unit_rate=0.2150,daily_standing_charge=0.4200,vat_rate=0.05,label=Renewal quote"]
      responses:
        "200":
          description: The actual cost and each alternative beside it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompareResponse"
        "400":
          description: >
            Malformed window, a missing or invalid `scope`, no `alt`, an unknown
            alt kind, or an `alt=flat` missing one of its three rates.


            `vat_rate` in particular is NOT defaulted to 5%. A VAT rate assumed
            wrong yields a comparison that is well-formed, internally consistent
            and wrong by a few percent with nothing on the wire to say so — the
            failure this service refuses everywhere else — and a statutory zero
            rate currently in force makes 5% a poor guess besides.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No configured agreement has the requested id or name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "501":
          description: >
            The named agreement is half-hourly, so comparing against it needs its
            own price curve, which this instance does not archive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: >
            No tariff is configured, or — for `window_mean` — some half hour in
            the window holds no price, so the window has no honest mean rate. A
            mean over the priced half would be a plausible-looking wrong number.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /tariffs:
    get:
      summary: Current tariffs by fuel
      description: >
        All configured tariffs keyed by fuel (electricity, gas, ...). Rates are
        ex-VAT; vat_rate gives the gross-up. Countinghouse bills electricity
        today; gas is exposed for forward-compatibility with gas devices.
      operationId: getTariffs
      tags: [data]
      responses:
        "200":
          description: Tariffs keyed by fuel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TariffsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /prices:
    get:
      tags: [prices]
      summary: Half-hourly prices over a window
      description: >
        The price curve for a window, past or future — the archive and the forward
        curve are the same table, which is the point of keeping prices rather than
        only fetching what is next. Returns 503 when the instance has no price
        archive configured, and `half_hourly: false` with a `flat_price` when the
        tariff covering the window is flat-rate rather than half-hourly.


        `window=today` means the WHOLE local day here, unlike the consumption
        routes where it is period-to-date: today's prices are published in full
        before today begins, so stopping at `now` would hand a dashboard half a
        chart. `week` and `month` stay period-to-date, because the supplier
        publishes only about a day and a half ahead.
      operationId: getPrices
      parameters:
        - { $ref: "#/components/parameters/IfNoneMatch" }
        - { $ref: "#/components/parameters/Window" }
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
      responses:
        "304":
          $ref: "#/components/responses/NotModified"
        "200":
          description: The curve, with per-slot band and rank
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriceCurveResponse" }
        "400":
          description: >
            Malformed window, a window longer than 31 days, or a window spanning a
            genuine tariff change. An agreement split that leaves the tariff code
            unchanged — such as the temporary zero rate of VAT on domestic electricity
            in Great Britain, 1 Oct 2026 to 31 Mar 2027 — is NOT a tariff change and is
            served normally: the prices served are the supplier's own inc-VAT figures
            from the archive, so a tax change arrives in them rather than needing to be
            applied. A flat-rate tariff across a VAT change is still refused, because
            `flat_price` is a single config-derived number that differs either side.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: No price archive configured, or no tariff covers the window
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /prices/upcoming:
    get:
      tags: [prices]
      summary: Everything known about the near future
      description: >
        The dashboard endpoint. Carries the curve plus the derivations a consumer
        would otherwise compute — and would compute differently from the next
        consumer: per-slot `band`, `rank` and `percentile`, a `summary` including
        the price in force right now, and the cheapest contiguous window for each
        of several durations. A duration that does not fit the window is OMITTED
        rather than shortened.
      operationId: getUpcomingPrices
      parameters:
        - { $ref: "#/components/parameters/IfNoneMatch" }
        - name: hours
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 48, default: 24 }
          description: >
            How far ahead to report. Capped at 48 because the supplier publishes
            at most about a day and a half ahead.
      responses:
        "304":
          $ref: "#/components/responses/NotModified"
        "200":
          description: The forward curve with bands, ranks and cheapest runs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpcomingPricesResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503":
          description: No price archive configured, or no tariff is in force
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /prices/cheapest:
    get:
      tags: [prices]
      summary: The cheapest contiguous window for a deferrable load
      description: >
        Answers "when should this run". Two behaviours worth knowing: a run will
        never span a GAP in the prices, because a window whose prices we do not
        hold cannot honestly be called cheap; and `before` is a deadline for
        FINISHING, not for starting, since a load that overruns into expensive
        time was not scheduled. A duration that is not a whole number of half hours
        rounds UP.
      operationId: getCheapestPrice
      parameters:
        - { $ref: "#/components/parameters/IfNoneMatch" }
        - name: duration
          in: query
          required: true
          schema: { type: string, example: 3h }
          description: Go duration, e.g. 90m or 3h. Must be positive and at most 24h.
        - name: before
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: The run must FINISH at or before this instant.
      responses:
        "304":
          $ref: "#/components/responses/NotModified"
        "200":
          description: The cheapest window found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheapestRunResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: >
            No contiguous window of that length exists in the prices held. A
            well-formed question with no answer, as distinct from a bad request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: >
            No price archive configured, no tariff covers the window, or the tariff
            is flat-rate. Unlike /prices and /prices/stats this route DOES refuse a
            flat tariff: every window ties, so there is no cheapest one, and a 200
            naming an arbitrary window would read as a recommendation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /prices/stats:
    get:
      tags: [prices]
      summary: Per-day price aggregates
      description: >
        Daily min, max, mean, spread and plunge-slot count, grouped by LOCAL
        calendar day — the only framing in which a 23- or 25-hour day makes sense.
        `spread` is the number that says whether shifting load that day was worth
        the bother. Figures are VAT-INCLUSIVE like every sibling price route, with
        ex-VAT values alongside under _exc_vat keys. Note `window=today` covers the
        WHOLE local day on the price routes, not the elapsed part.


        A FLAT-RATE tariff answers `200` with `half_hourly: false`, a `flat_price`
        and an EMPTY `days` array — the same shape /prices and /prices/upcoming
        give, because a flat tariff is a valid state rather than a service failure.
        This route used to answer 503 there, so one window could be a 200 on two
        sibling routes and a 503 on the third, forcing a seasonal analysis to
        special-case per endpoint rather than per window.
      operationId: getPriceStats
      parameters:
        - { $ref: "#/components/parameters/IfNoneMatch" }
        - { $ref: "#/components/parameters/Window" }
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
      responses:
        "304":
          $ref: "#/components/responses/NotModified"
        "200":
          description: Per-day aggregates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriceStatsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503":
          description: >
            No price archive configured, or no tariff covers the window. NOT
            returned for a flat-rate tariff, which is a 200 carrying
            `half_hourly: false` and a `flat_price`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /metrics:
    get:
      summary: Service metrics
      description: Influx query counters and basic runtime info.
      operationId: getMetrics
      tags: [data]
      responses:
        "200":
          description: Metrics snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /devices:
    get:
      summary: Device catalog
      description: >
        Discovery catalog: a pass-through of the statehouse_devices namespace
        enriched with a derived capabilities hint ("energy" when the class is
        metered, "events" for event-bearing classes — binary_state_device,
        fire_alarm). Lets a UI build a device picker without knowing Influx.
        Sorted by id. When a whole-house meter is configured, a synthetic
        "unmonitored" entry (class "unmonitored", capability "energy", id reserved)
        is included so the rest-of-home series appears in pickers and plots through
        /devices/unmonitored/series like any device.
      operationId: getDevices
      tags: [data]
      responses:
        "200":
          description: Device catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicesCatalog"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /floors:
    get:
      summary: Floor catalog
      description: >
        The building's floors, and the discoverable vocabulary behind the
        `floors=` filter and `group_by=floor`. Lists exactly the floors at least
        one BILLED device declares (metered, excluding the whole-house meter),
        which is exactly the set `floors=` accepts — so a picker filled from this
        endpoint cannot build a request /series rejects. A floorplan record for a
        floor with no metered device is therefore not listed, and a floor devices
        declare that the floorplan has no record for IS listed, with its name
        empty and order null. Sorted by declared storey order ascending, then by
        id; floors with no declared order sort last. Reads the same floorplan
        namespace greenhouse serves /floors from, so both services answer in one
        vocabulary.
      operationId: getFloors
      tags: [data]
      responses:
        "200":
          description: Floor catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FloorsCatalog"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /rooms:
    get:
      summary: Room catalog
      description: >
        The building's rooms, and the discoverable vocabulary behind the `rooms=`
        filter and `group_by=room`. Listed on the same rule as /floors: exactly
        the rooms at least one billed device is attributed to. `category` is
        relayed RAW rather than reduced to a flag — a plant room's consumption is
        infrastructure rather than household usage, but which rooms "count" is a
        per-dashboard policy question. The reserved "house" key (a coverage
        scope, not a room) never appears. Sorted by floor storey order, then by
        room id; rooms whose floor is unknown sort last.
      operationId: getRooms
      tags: [data]
      responses:
        "200":
          description: Room catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomsCatalog"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /devices/{id}/events:
    get:
      summary: Device event timeline
      description: >
        Ordered state-transition edges for one device over the window
        (vertical-line overlays). Each event carries the raw from/to labels and
        a normalized on flag (omitted for momentary/unknown labels).
      operationId: getDeviceEvents
      tags: [data]
      parameters:
        - $ref: "#/components/parameters/DeviceID"
        - $ref: "#/components/parameters/Window"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Transition events for the device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceEventsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"

  /devices/{id}/intervals:
    get:
      summary: Device on/off intervals
      description: >
        Sustained ON spans for one device over the window (shaded bands), with
        the carry-in opening state (state_at_start), per-interval durations, an
        open flag for an in-progress span at the window end, and summary stats
        (on_count, total_on_seconds, duty).
      operationId: getDeviceIntervals
      tags: [data]
      parameters:
        - $ref: "#/components/parameters/DeviceID"
        - $ref: "#/components/parameters/Window"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Intervals and stats for the device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceIntervalsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"

  /events:
    get:
      summary: Multi-device event overlay
      description: >
        Categorical timeline overlay across a device set. The set comes from
        devices= (csv of ids; an unknown id is a 400), class= (all devices of a
        class), or the default (all event-bearing devices: binary_state_device,
        fire_alarm). group_by=device
        (default) yields one series per device; group_by=class merges every
        member device's events under each class key, time-ordered.
      operationId: getEvents
      tags: [data]
      parameters:
        - name: devices
          in: query
          required: false
          description: Comma-separated device ids to overlay. An unknown id is a 400.
          schema:
            type: string
        - name: class
          in: query
          required: false
          description: Restrict the set to devices of this class (ignored when devices= is given).
          schema:
            type: string
        - $ref: "#/components/parameters/Window"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: group_by
          in: query
          required: false
          description: How to group series. Defaults to "device".
          schema:
            type: string
            enum: [device, class]
            default: device
      responses:
        "200":
          description: Columnar multi-device event overlay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/BadGateway"

components:
  headers:
    WindowCacheControl:
      description: >
        How long this answer may be reused. `private, max-age=30` for a window
        that ends at or after now (the last bucket is still filling) and
        `private, max-age=300` for a `custom` window that has already closed, in
        which no new telemetry falls.


        These routes carry NO `ETag`, and the asymmetry with the price routes is
        deliberate (issue #36 N7). /prices has a SEMANTIC fingerprint — a fixed
        set of archived slots plus the current one — that two requests can be
        compared on without rendering either. The window-derived routes read from
        Influx, which moves continuously, so the only strong validator available
        is a hash of the rendered body. That is exactly the bug the price routes
        already fixed: a tag that changes on every request, so the 304 never fires
        and the caller pays for the conditional round trip and then re-downloads.


        A WEAK validator is the other option and is worse than none, because it
        would tell a polling consumer "unchanged" about an answer that
        late-arriving telemetry has changed. `max-age` promises only what it can
        keep.


        300 rather than 3600 for the settled case because settled is not
        immutable: a device that was offline can backfill into a closed window.
      schema:
        type: string
        example: private, max-age=30

  parameters:
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: >-
        An ETag from a previous response. When it still matches, the server answers 304
        with no body instead of re-sending the curve.
      schema:
        type: string
    DeviceID:
      name: id
      in: path
      required: true
      description: Device id (key in the statehouse_devices namespace).
      schema:
        type: string
    Window:
      name: window
      in: query
      required: false
      description: >-
        Window spec. Defaults to "today". Period-to-date: today, week (from
        Monday), month (from the 1st) — all ending now. custom: an explicit
        from/to range. Rolling: "<N>d" is a trailing N calendar days ending now,
        DAY-ALIGNED to local midnight (e.g. 7d = today + the previous 6 days;
        1d == today); "<N>h" is an EXACT trailing N hours (e.g. 24h), not
        midnight-aligned. N is a positive integer.
      schema:
        type: string
        default: today
        pattern: '^(today|week|month|custom|[0-9]+[dh])$'
        example: 7d
    From:
      name: from
      in: query
      required: false
      description: >-
        Custom window start (RFC3339). Required when window=custom, and ONLY
        valid then — supplying from with any other window (period-to-date
        today/week/month or rolling <N>d/<N>h, which derive their own range) is
        rejected with 400.
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: false
      description: >-
        Custom window end (RFC3339). Required when window=custom, and ONLY
        valid then — supplying to with any other window (period-to-date
        today/week/month or rolling <N>d/<N>h, which derive their own range) is
        rejected with 400.
      schema:
        type: string
        format: date-time
    Interval:
      name: interval
      in: query
      required: false
      description: >
        Bucket granularity. Defaults smartly to the window (today→1h,
        week/month→1d, custom and rolling <N>d/<N>h→by span). An interval whose bucket count over the
        window exceeds the ~1000 cap returns 400 asking for a coarser interval.
        For window=custom whose from is not on an interval boundary, the bucket
        axis snaps DOWN to the interval grid anchored at local midnight (so it
        matches the aggregation boundaries); the first bucket is widened to that
        boundary. Period-to-date windows already start at local midnight and are
        unaffected.
      schema:
        type: string
        enum: [5m, 15m, 30m, 1h, 6h, 1d]
    GroupBy:
      name: group_by
      in: query
      required: false
      description: >
        How to group series. Defaults to "device". "floor" groups by the floor a
        device DECLARES (never one derived from its room id) and sums it, since
        energy is additive. A device whose readings describe the whole property
        groups under the reserved "house" key in both place groupings (room and
        floor) rather than being attributed to a place it does not describe.
      schema:
        type: string
        enum: [device, room, floor, class, house]
        default: device
    RoomsFilter:
      name: rooms
      in: query
      required: false
      description: >
        Comma-separated floorplan room ids; only devices in those rooms are
        covered. Composes with floors= as AND. An omitted parameter, or a bare
        `rooms=`, means no filter; a value carrying only separators or whitespace
        (`rooms=,,`) is rejected with 400 rather than silently widening to the
        whole house. A room holding no billed device is
        rejected with 400 rather than silently returning an unfiltered or empty
        answer — the accepted set is exactly what GET /rooms lists, so a picker
        filled from that catalog cannot produce a rejected request. The reserved
        "house" key is a coverage scope, not a room, and is rejected. CANNOT be
        combined with include_unmonitored=true or group_by=house (400): the
        unmonitored series is the meter minus ALL monitored devices, so against a
        filtered set it would absorb the excluded devices and report them as
        rest-of-home.
      schema:
        type: string
        example: floor1.room-a,floor2.room-b
    FloorsFilter:
      name: floors
      in: query
      required: false
      description: >
        Comma-separated floor ids; only devices declaring those floors are
        covered. The coarse sibling of rooms=, with the same rules: AND
        composition, 400 on a floor holding no billed device (the accepted set is
        exactly what GET /floors lists), and rejected alongside
        include_unmonitored=true or group_by=house.
      schema:
        type: string
        example: floor1
    IncludeUnmonitored:
      name: include_unmonitored
      in: query
      required: false
      description: >
        When true, a device/room/floor/class grouping gains exactly one extra
        "unmonitored" (rest-of-home) series so the parts sum to the whole-house
        meter. Never subdivided (one series regardless of grouping); a no-op when
        no meter is configured. Ignored for group_by=house (which always includes
        it). Under group_by=floor it is returned as its own series and is never
        attributed to a floor — the residual is house-scoped and belongs to no
        storey. Rejected with 400 alongside rooms= or floors=, since the residual
        is defined against the whole monitored fleet. Default false — the response
        is otherwise unchanged.
      schema:
        type: boolean
        default: false
    WithPrices:
      name: prices
      in: query
      required: false
      description: >
        Opt in to the per-bucket price array: `prices[]` aligned to `buckets[]`,
        plus `price_unit`, `price_vat_included`, `price_basis`,
        `unpriced_buckets` and `tariff_codes`. Default false, so no existing
        payload grows.


        It exists because `cost` is kwh × price and the price cannot be recovered
        from a bucket where kwh is zero — which are exactly the buckets that
        answer "it was cheap and we did NOT use it". Joining /series to /prices on
        an RFC3339 string instead works only while both are 30m: at interval=15m
        it silently matched half the buckets. The server resolves by containment,
        so it can answer at any interval.
      schema:
        type: boolean
        default: false

    Unclamped:
      name: unclamped
      in: query
      required: false
      description: >
        Diagnostic mode: when true, the unmonitored series is the RAW signed
        residual (meter − monitored) with negatives preserved, instead of clamped
        at 0. Negative kWh/cost/avg_w can appear; this deliberately breaks the
        monitored+unmonitored==meter presentation, for investigating meter/device
        drift. Default false. (Operators also have the drift_buckets_total metric.)
      schema:
        type: boolean
        default: false
    Shape:
      name: shape
      in: query
      required: false
      description: >
        Response layout. "columns" (default) is the columnar SeriesResponse — a
        shared `buckets` axis plus per-series value arrays (ideal for web charting
        libraries). "rows" is the row-oriented RowsResponse — a flat `rows` list of
        one object per (series, bucket), idiomatic for Codable consumers and
        grouped native charts (e.g. Swift Charts). The 200 response schema is the
        corresponding SeriesResponse or RowsResponse.
      schema:
        type: string
        enum: [columns, rows]
        default: columns

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    NotModified:
      description: >-
        The representation has not changed since the ETag the client sent. No body.


        Fires on a repeat request when nothing that determines the answer has moved: the
        tariff, the window truncated to the half-hour grid, and the prices themselves.
        Deliberately NOT keyed on `generated_at`, which moves every request — hashing the
        rendered body meant this response could never occur on three of the four price
        routes, and a dashboard re-downloaded every slot on every poll.
    Unauthorized:
      description: Missing or invalid Bearer JWT
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Invalid or missing query parameters, or device has no energy series
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Unknown device or absent tariff
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unavailable:
      description: No tariff configured
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Internal:
      description: >
        Server-side inconsistency — the request was valid and upstream answered,
        but the response could not be assembled (e.g. a device the class gate
        admits produced no series). Never returned in normal operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadGateway:
      description: Upstream Influx query failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        limits:
          allOf:
            - $ref: "#/components/schemas/Limits"
          description: >
            Present on cap refusals only — a window over a bucket or day cap. The
            prose message is unchanged; these are the same numbers as data.
      required: [error]

    Agreement:
      type: object
      description: >
        One dated tariff commitment: which tariff applied, between when and when,
        and what it cost. Intervals are half-open — `from` inclusive, `to`
        exclusive. A legacy single-rate configuration is presented as one
        agreement with neither bound.
      properties:
        available_now:
          type: boolean
          description: >
            Whether this agreement covers the present instant, derived from its
            own dates against the service clock. The dates were always here; what
            was missing was the service doing the comparison.


            It exists because comparing a window against a tariff that has
            already EXPIRED is the easiest baseline error to make when building a
            counterfactual, and an expired baseline is otherwise a silence rather
            than a labelled field.
        from:
          type: string
          format: date-time
          description: >
            Inclusive start. Absent only on the synthesised block representing a
            legacy single-rate configuration, which asserts nothing about when its
            rate began.
        to:
          type: string
          format: date-time
          description: Exclusive end. Absent when the agreement is still current.
        name:
          type: string
          description: Human label for the tariff, e.g. "Agile Octopus".
          example: Agile Octopus
        type:
          type: string
          enum: [fixed, variable]
          description: >
            `fixed` carries its own `unit_rate`. `variable` does NOT: its price
            varies within the agreement (half-hourly), so there is no single
            number to report and the half-hourly curve must be read from the price
            endpoints instead. Note this is narrower than the industry sense of
            "variable" — a supplier's standard variable rate, one number that
            changes every few months, is configured as successive `fixed`
            agreements because it has no intra-agreement curve.
        id:
          type: string
          description: >
            Supplier tariff code. Always present on a `variable` agreement, where
            it is the key its half-hourly prices are stored under; optional on a
            `fixed` one.
          example: E-1R-AGILE-24-10-01-A
        unit:
          type: string
          example: kWh
        vat_rate:
          type: number
          description: Carried per agreement, so a historical VAT change prices correctly.
        unit_rate:
          type: number
          description: >
            GBP per kWh, ex-VAT. Present on `fixed` agreements only — absent on
            `variable`, deliberately.
        daily_standing_charge:
          type: number
          description: >
            GBP per day, ex-VAT. Present on both types: a standing charge is flat
            per day even when the unit rate is half-hourly.
      required: [name, type, vat_rate, daily_standing_charge]

    PriceSlot:
      type: object
      description: >
        One half hour of the curve, with the derivations served rather than left to
        each consumer — so two dashboards agree on what "cheap" means.
      properties:
        valid_from: { type: string, format: date-time }
        valid_to:   { type: string, format: date-time }
        price:
          type: number
          description: >
            Pence per kWh, VAT INCLUSIVE. Signed: negative means being paid to
            consume, and exactly 0.00 is a real price.
        rank:
          type: integer
          description: Position by price within the window, 1 being the CHEAPEST.
        percentile:
          type: number
          description: Position in [0,1], 0 being the cheapest. For deriving your own banding.
        band:
          type: string
          enum: [plunge, cheap, normal, peak]
          description: >
            Classification against the window's MEDIAN, which `summary.median`
            reports so the bands can be reproduced or replaced. `plunge` is any
            price at or below zero, kept separate because free energy is
            categorically different from merely cheap. The others sit +/-15% from
            the median, which is deliberately NOT a percentile split — a tercile
            would label a third of a flat day a peak, which is false. The centre is
            the median rather than the mean because a cluster of plunge slots drags
            a mean well below the middle of the day.
      required: [valid_from, price, rank, band]

    PriceCurveSummary:
      type: object
      properties:
        slots: { type: integer }
        min:   { type: number }
        max:   { type: number }
        mean:  { type: number }
        median:
          type: number
          description: >
            The centre `band` is measured against. Served because a consumer is
            invited to derive its own banding from this summary, which is
            impossible without the figure the bands are actually drawn from.
        current:
          type: number
          description: >
            The price of the slot covering now. Absent when no held slot covers it.

    PriceRun:
      type: object
      description: A contiguous stretch of slots, and what it averages.
      properties:
        from:  { type: string, format: date-time }
        to:    { type: string, format: date-time }
        slots: { type: integer }
        mean_price:
          type: number
          description: Mean pence per kWh across the run, VAT inclusive.

    PriceCurveResponse:
      type: object
      properties:
        window:      { type: string }
        from:        { type: string, format: date-time }
        to:          { type: string, format: date-time }
        tariff_code: { type: string }
        known_to:
          type: string
          format: date-time
          nullable: true
          description: >
            End of the newest slot held for this tariff — how far prices run at all,
            independently of the window asked for. This is how a polling consumer sees
            the daily publication: when it moves, there is more curve to draw. It is
            part of the ETag, so a publication that extends the horizon without
            touching this window's slots still invalidates the cached response.
            NULL when the archive holds nothing for the tariff.
        half_hourly:
          type: boolean
          description: >
            False when the tariff covering the window is flat-rate. `slots` is then
            empty and `flat_price` carries the rate — a different shape of answer
            rather than an empty curve, so it is not mistaken for a broken archive.
        flat_price:  { type: number }
        unit:        { type: string, example: p/kWh }
        vat_included: { type: boolean }
        summary:     { $ref: "#/components/schemas/PriceCurveSummary" }
        slots:
          type: array
          items: { $ref: "#/components/schemas/PriceSlot" }
        complete:
          type: boolean
          description: Whether every half hour of the window holds a price.

    UpcomingPricesResponse:
      type: object
      properties:
        tariff_code:  { type: string }
        half_hourly:  { type: boolean }
        flat_price:   { type: number }
        unit:         { type: string, example: p/kWh }
        vat_included: { type: boolean }
        generated_at: { type: string, format: date-time }
        from:         { type: string, format: date-time }
        to:           { type: string, format: date-time }
        known_to:
          type: string
          format: date-time
          nullable: true
          description: >
            End of the newest slot held for this tariff — how far prices run at all, which
            may be beyond the requested window. NULL when the archive holds nothing yet for
            it: `0001-01-01T00:00:00Z` reads as corruption rather than as "nothing held",
            and the store deliberately distinguishes "we hold nothing" from "the read
            failed".
        summary: { $ref: "#/components/schemas/PriceCurveSummary" }
        slots:
          type: array
          items: { $ref: "#/components/schemas/PriceSlot" }
        cheapest:
          type: object
          description: >
            Cheapest contiguous window per duration, keyed 30m/1h/2h/3h. A duration
            that does not fit the window is OMITTED rather than shortened — a run
            labelled 3h must actually be three hours.
          additionalProperties: { $ref: "#/components/schemas/PriceRun" }
        missing:
          type: array
          description: >
            Half-hour starts within the window that hold no price. Stated rather
            than left to be inferred from a short `slots` array.
          items: { type: string, format: date-time }
        complete: { type: boolean }

    CheapestRunResponse:
      allOf:
        - $ref: "#/components/schemas/PriceRun"
        - type: object
          properties:
            tariff_code:  { type: string }
            unit:         { type: string, example: p/kWh }
            vat_included: { type: boolean }
            searched_to:
              type: string
              format: date-time
              description: How far ahead the search looked.

    PriceDayStats:
      type: object
      properties:
        day:
          type: string
          description: Local calendar date, YYYY-MM-DD.
        slots:  { type: integer, description: "46, 48 or 50 depending on the DST changeover." }
        min:    { type: number }
        max:    { type: number }
        mean:   { type: number }
        spread:
          type: number
          description: max − min. Whether shifting load that day was worth the bother.
        min_exc_vat:
          type: number
          description: >-
            The same four figures EX VAT. The unsuffixed keys are inc-VAT, matching
            every sibling price route, so a daily mean can be plotted against a live
            price without a silent 5% error; the ex-VAT figures keep an explicit
            suffix because they remain the right basis for comparing days against
            each other, and are what the supplier publishes as primary. Both sets are
            computed independently rather than grossed up, because VAT on a negative
            price makes it more negative.
        max_exc_vat:
          type: number
        mean_exc_vat:
          type: number
        spread_exc_vat:
          type: number
        plunge_slots:
          type: integer
          description: Half hours priced at or below zero.

    PriceStatsResponse:
      type: object
      properties:
        window:      { type: string }
        from:        { type: string, format: date-time }
        to:          { type: string, format: date-time }
        tariff_code: { type: string }
        half_hourly:
          type: boolean
          description: >
            False when the tariff covering the window is flat-rate. `days` is then
            empty and `flat_price` carries the rate — a flat tariff has no daily
            spread, which an empty array of daily spreads states exactly. Present on
            BOTH branches: a flag appearing only in the flat case would have to be
            tested for absence rather than read.
        flat_price:
          type: number
          description: Present only when `half_hourly` is false. Pence per kWh, inc-VAT.
        note:
          type: string
          description: Present only when `half_hourly` is false.
        unit:        { type: string, example: p/kWh }
        vat_included:
          type: boolean
          description: >-
            True — the unsuffixed per-day figures are inc-VAT, as on every sibling
            price route. The ex-VAT figures are carried under explicit _exc_vat keys.
        days:
          type: array
          description: Empty when `half_hourly` is false. Never absent.
          items: { $ref: "#/components/schemas/PriceDayStats" }

    PriceHealth:
      type: object
      description: >-
        One tariff's price-archive health. `known_to` and `complete_to` answer
        DIFFERENT questions and a monitor reading only the first will be misled:
        a publication can advance the horizon across a whole day while leaving
        that day short of slots, which is observed behaviour rather than a
        hypothetical.


        This is the FULL shape, served on /metrics, which is authenticated.
        Unauthenticated /healthz serves `PriceHealthRedacted` — same fields less
        `last_error`. Anything added here has to be safe for a caller holding a
        token, not for the public internet.
      properties:
        tariff_code:
          type: string
          example: E-1R-AGILE-24-10-01-A
        known_to:
          type: string
          format: date-time
          description: >-
            End of the newest slot held — "prices are arriving". Absent when the
            archive is empty.
        complete_to:
          type: string
          format: date-time
          description: >-
            How far prices run with no gaps — "we can bill this far". It stops at the
            first INTERIOR hole, and not at the supplier's routine two-slot tail on the
            furthest published day, because everything before that tail is billable.
            This is the field to alert on.


            In normal operation it therefore EQUALS `known_to`. That is the signal, not
            a redundancy: the two diverge exactly when a slot the supplier published
            never reached us, so `complete_to < known_to` means a real hole rather than
            a horizon.
        last_attempt:
          type: string
          format: date-time
          description: Moves on every sync, successful or not.
        last_success:
          type: string
          format: date-time
          description: >-
            Moves only on a sync that worked. Lagging behind last_attempt means
            collection is failing right now; it is cleared back into step on the
            next success.
        last_error:
          type: string
          description: >-
            The most recent failure, absent once a sync succeeds. /metrics only: the
            text can quote an upstream we do not control, so /healthz publishes only
            `last_error_class`.
        last_error_class:
          type: string
          description: >-
            The same failure named in fixed words the collector chooses from the typed
            error — "upstream rate limited", "upstream rejected our request", "upstream
            unavailable", "upstream timeout", "upstream error", "archive error", or a bare
            "error". Enough to route an alert without quoting anything. Present
            on both /metrics and /healthz, and cleared by a success alongside
            `last_error`.
          example: upstream unavailable
        syncs:
          type: integer
        failures:
          type: integer
        inserted:
          type: integer
          description: Slots newly stored since start.
        restated:
          type: integer
          description: >-
            Prices the supplier revised AFTER we had already stored them. Rare,
            and worth investigating: a bill already issued may have moved.
        rejected:
          type: integer
          description: >-
            Slots refused by validation and therefore not stored. Never silently
            dropped — each is logged and counted.
        warnings:
          type: integer
          description: >-
            Slots stored but flagged as implausible (beyond the price cap or
            sanity floor). Flagged rather than rejected: negative prices are real.

    TariffsResponse:
      type: object
      properties:
        fetched_at:
          type: string
          format: date-time
          description: >-
            When this namespace was last fetched, successfully or not. Omitted
            when there is nothing to report — no fetcher wired, or a namespace it
            has never heard of — rather than sent as a zero time.
        stale:
          type: boolean
          description: >-
            True when the most recent fetch attempt FAILED, so the document being
            served is the last known good one. The error text stays on /healthz.


            This matters more than fetched_at given the fail-open design: "boot
            needs truth, running keeps the last truth" means a later failure keeps
            serving an arbitrarily old snapshot and merely degrades /healthz, so a
            consumer could be handed stale config with a 200 and nothing at the
            point of use to say so.
        currency:
          type: string
          example: GBP
        source:
          type: string
          description: >
            The config namespace that answered. Reported rather than inferred,
            because the response shape is deliberately identical either way.
          example: energy_agreements
        agreements:
          type: object
          description: Agreements keyed by fuel (e.g. electricity, gas), oldest first.
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/Agreement"

    DeviceEnergyResponse:
      type: object
      properties:
        device_id:
          type: string
        kwh:
          type: number
        source:
          type: string
          enum: [counter, integral]
        window:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
      required: [device_id, kwh, source, window, from, to]

    DeviceCostResponse:
      type: object
      properties:
        device_id:
          type: string
        kwh:
          type: number
        cost:
          type: number
        currency:
          type: string
          example: GBP
        window:
          type: string
        attribution:
          type: string
          enum: [flat_rate, counter_slot]
          description: >-
            How cost was derived. flat_rate: kWh x one unit rate, exact.
            counter_slot: each half hour's counter delta priced at that half hour's
            own rate — sums exactly over the window, but noisy for a low-draw device
            over a single day (0.1 kWh counter quantisation).
        effective_rate:
          type: number
          description: >-
            VAT-inclusive GBP/kWh actually paid (cost / priced kWh). May be NEGATIVE:
            a half-hourly tariff can pay you to consume. 0 when there is no energy.
        unpriced_kwh:
          type: number
          description: >-
            Energy in half hours no rate is held for. NOT included in cost; absent
            when zero. Non-zero means this answer is incomplete, not that the energy
            was free.
        tariff:
          type: object
          description: >-
            The single rate charged. Present ONLY under attribution=flat_rate; a
            half-hourly tariff has no single rate, and a representative one would be
            read as the price. Ask /prices for the curve instead.
          properties:
            unit_rate:
              type: number
            vat_rate:
              type: number
      required: [device_id, kwh, cost, currency, window, attribution, effective_rate]

    DeviceCostBreakdown:
      type: object
      properties:
        device_id:
          type: string
        display_name:
          type: string
        room:
          type: string
          description: >
            Floorplan room id. Empty for a device whose readings describe the whole
            property rather than a room; see covers.
        floor:
          type: string
          description: >
            Floor id as DECLARED by the devices namespace, e.g. "floor2". Empty
            when the namespace declares none — never derived from the room id's
            "<floor>.<slug>" shape, since the floorplan owns that fact. Join to
            /floors for its name, storey order and elevation.
        covers:
          type: string
          description: >
            Set when the device's readings describe the whole property rather than the
            room it sits in, which is why its room may be empty.
        class:
          type: string
        kwh:
          type: number
        cost:
          type: number
        effective_rate:
          type: number
          description: >-
            VAT-inclusive GBP/kWh this device actually paid (cost / priced kWh). May
            be negative. 0 when the device used no energy.
        unpriced_kwh:
          type: number
          description: >-
            This device's energy in half hours no rate is held for. NOT included in
            cost; absent when zero.

    Reconciliation:
      type: object
      required: [meter_present, monitored_kwh]
      properties:
        meter_present:
          type: boolean
          description: >-
            Whether an energy_meter is configured. When false there is nothing
            to reconcile against, so meter_kwh, unmonitored_kwh and coverage are
            OMITTED (rather than reported as a misleading negative remainder /
            zero coverage).
        monitored_kwh:
          type: number
        meter_kwh:
          type: number
          description: >-
            Whole-house meter total. Present only when meter_present is true.
        unmonitored_kwh:
          type: number
          description: >-
            meter_kwh − monitored_kwh. Present only when meter_present is true.
        coverage:
          type: number
          description: >-
            Monitored fraction of meter; not clamped to [0,1]. Present only when
            meter_present is true.
        unmonitored_cost:
          type: number
          description: >-
            The rest-of-home remainder, priced through the SAME pricer the device
            rows used — under a half-hourly tariff, per half hour at each half
            hour's own rate. It is the same quantity /series?group_by=house
            reports as the "unmonitored" series' cost, from the same build, so the
            two cannot disagree. Omitted when not derivable.
        unmonitored_priced_kwh:
          type: number
          description: >-
            The energy `unmonitored_cost` was computed from. NOT always
            `unmonitored_kwh`: that is meter − monitored over the whole window,
            signed, whereas the bucketed path prices the per-bucket residual with
            each bucket clamped at zero. Reported so the pair stays
            self-consistent instead of implying an effective rate nobody charged.

    BillResponse:
      type: object
      properties:
        window:
          type: string
        currency:
          type: string
          example: GBP
        devices:
          type: array
          items:
            $ref: "#/components/schemas/DeviceCostBreakdown"
        scope:
          type: string
          enum: [monitored_devices]
          description: >-
            What `energy_cost` and `total` cover: the monitored devices, NOT the
            household. Always present. It exists because the endpoint is called
            /bill and the name does not say it.
        household_energy_cost:
          type: number
          description: >-
            `energy_cost` PLUS the unmonitored remainder, priced through the same
            pricer — the whole home's energy. Omitted when no meter is configured
            or the remainder could not be priced, rather than sent as a figure
            that silently excludes half the house.
        household_total:
          type: number
          description: >-
            `household_energy_cost` plus the standing charge: the number a person
            would call "the bill". Top-level rather than inside `reconciliation`,
            because burying the real figure inside the block that explains the gap
            is how it gets missed.
        energy_cost:
          type: number
          description: >-
            Sum of the per-device costs. Excludes the standing charge AND the
            unmonitored remainder — see `scope`.
        standing_charge:
          type: number
          description: >-
            VAT-inclusive GBP for the window, apportioned across tariff segments and
            pro rata for a partial day. Charged once here and NEVER split across
            devices — no device causes it.
        standing_charge_source:
          type: string
          enum: [archive, config]
          description: >-
            Where that figure came from. `archive` is the supplier's own
            VAT-inclusive daily charge, so a VAT change arrives in it rather than
            having to be applied — the same basis as energy. `config` is the
            configured ex-VAT rate grossed up by the configured vat_rate, which is
            correct only while that rate is kept current; it is the fallback when no
            standing charge is archived for the whole window, or when the window
            spans a genuine tariff change.
        total:
          type: number
          description: >-
            energy_cost + standing_charge. Can be lower than standing_charge alone
            when negative half-hourly prices make energy_cost a credit.
        attribution:
          type: string
          enum: [flat_rate, counter_slot]
          description: >-
            How the energy costs were derived; counter_slot when any part of the
            window is half-hourly. See /devices/{id}/cost.
        effective_rate:
          type: number
          description: >-
            VAT-inclusive GBP/kWh across all monitored energy (energy_cost / priced
            kWh). On a half-hourly tariff this is the single number saying how well
            the house played the price curve. May be negative.
        unpriced_kwh:
          type: number
          description: >-
            Monitored energy no rate was held for, summed across devices. Absent when
            zero; non-zero means this bill is INCOMPLETE, not that the energy was
            free.
        reconciliation:
          $ref: "#/components/schemas/Reconciliation"

    BackupHealth:
      type: object
      description: >-
        State of the price archive's offsite backup to Cloudflare R2. The archive is
        the one thing countinghouse writes and the only state not rebuildable from
        Influx, so whether it is actually backed up is reported rather than assumed.


        This is the FULL shape, served on /metrics, which is authenticated. It names
        our infrastructure — bucket, key prefix, object key — and none of that reaches
        unauthenticated /healthz, which serves `BackupHealthRedacted` instead.


        Nothing here is a credential and nothing that is one may be added, on either
        endpoint. Error text is additionally scrubbed of anything credential-shaped
        before it is served at all.
      required: [bucket, env, successes, failures]
      properties:
        bucket:
          type: string
          description: R2 bucket the archive is uploaded to.
          example: countinghouse-sqlite
        env:
          type: string
          enum: [production, development]
          description: >-
            The R2 key prefix. Objects land at
            `{env}/backups/countinghouse/{YYYY}/{MM}/{DD}/countinghouse-{RFC3339}.sqlite3`.
        schedule:
          type: string
          enum: [daily, weekly, monthly, off]
          description: >-
            When scheduled backups run. `off` means on-demand only, and suppresses the
            staleness verdict — an old backup is then what was asked for.
        hour:
          type: integer
          description: UTC hour (0-23) scheduled backups run at. 0 is midnight, not unset.
        last_attempt:
          type: string
          format: date-time
          description: >-
            Moves on every run, succeeded or not. Absent before the first run.
        last_success:
          type: string
          format: date-time
          description: >-
            Moves only on a run that worked, so a last_success lagging behind
            last_attempt means backups are failing NOW. Absent until one succeeds.
        last_key:
          type: string
          description: >-
            Object key of the most recent successful upload, so the newest backup can
            be found without listing the bucket. Survives a later failure: the last
            good backup is still the last good backup.
          example: production/backups/countinghouse/2026/09/12/countinghouse-2026-09-12T03:00:00Z.sqlite3
        last_error:
          type: string
          description: >-
            Why the most recent run failed, scrubbed of anything credential-shaped.
            Cleared by a success, so one bad night does not degrade the service
            forever. /metrics only — the R2 endpoint host and object key turn up in
            these messages, which is exactly what /healthz withholds.
        last_error_class:
          type: string
          enum: [backup failed]
          description: >-
            That a run failed, without saying what failed. One value today, because
            for a backup the fact IS the alert: the remedy does not change with the
            cause. Present on both endpoints; cleared by a success.
        successes:
          type: integer
        failures:
          type: integer
        next_run:
          type: string
          format: date-time
          description: >-
            When the next SCHEDULED backup is due. Omitted when nothing schedules one —
            `schedule: off`, or an on-demand-only deployment. It answers the question the
            timestamps cannot ("is a backup coming?"), which is what separates a fresh
            start from a wedged scheduler.

    PriceHealthRedacted:
      type: object
      description: >-
        One tariff's price-archive health as served on /healthz, which is
        UNAUTHENTICATED and built to be polled by anything.
        Every field of `PriceHealth` except `last_error`, whose text can quote an
        upstream we do not control; `last_error_class` carries the failure instead.
        Field meanings are identical — see `PriceHealth`.


        Spelled out as its own schema rather than "PriceHealth, minus one field",
        because a generated client reading the fuller schema would offer callers a
        `last_error` that is never populated here, and an operator would write the
        alert that never fires.
      properties:
        tariff_code:
          type: string
          example: E-1R-AGILE-24-10-01-A
        known_to:
          type: string
          format: date-time
        complete_to:
          type: string
          format: date-time
          description: How far prices run with no gaps. This is the field to alert on.
        last_attempt:
          type: string
          format: date-time
        last_success:
          type: string
          format: date-time
        last_error_class:
          type: string
          description: >-
            What went wrong, in fixed words — never the upstream's own text. Absent
            once a sync succeeds. A failure recorded with no class reports the bare
            "error" rather than nothing at all, so the presence of this field is a
            reliable "collection is failing".
          example: upstream unavailable
        syncs:
          type: integer
        failures:
          type: integer
        inserted:
          type: integer
        restated:
          type: integer
        rejected:
          type: integer
        warnings:
          type: integer

    BackupHealthRedacted:
      type: object
      description: >-
        Offsite-backup state as served on /healthz, which is UNAUTHENTICATED.
        The operational signal — is a backup scheduled, did the last one work, when is
        the next — with everything that names our infrastructure removed: no `bucket`,
        no `env`, no `last_key`, no `last_error`. An anonymous caller can still tell a
        healthy backup from a failing one, which is the only thing /healthz owes them.
        Field meanings are identical — see `BackupHealth`.
      required: [successes, failures]
      properties:
        schedule:
          type: string
          enum: [daily, weekly, monthly, off]
        hour:
          type: integer
          description: UTC hour (0-23) scheduled backups run at. 0 is midnight, not unset.
        last_attempt:
          type: string
          format: date-time
        last_success:
          type: string
          format: date-time
          description: >-
            Absent until one succeeds. Lagging behind last_attempt means backups are
            failing NOW.
        last_error_class:
          type: string
          enum: [backup failed]
          description: >-
            That the last run failed. Not why: the cause names the R2 endpoint and the
            object key, and the remedy does not depend on it. /metrics has the text.
        successes:
          type: integer
        failures:
          type: integer
        next_run:
          type: string
          format: date-time

    MetricsResponse:
      type: object
      properties:
        query_count:
          type: integer
        query_errors:
          type: integer
        influx_avg_latency_ms:
          type: number
        drift_buckets_total:
          type: integer
          description: >
            Cumulative count of negative-residual drift buckets (meter below
            monitored beyond the 0.1 kWh counter quantum) observed across served
            series requests. A growing value means the unmonitored decomposition is
            being distorted — investigate via WARN logs or unclamped=true.
        version:
          type: string
        uptime_seconds:
          type: integer
        goroutines:
          type: integer
        prices:
          type: array
          description: >-
            Price-archive counters, one entry per half-hourly tariff being collected
            (same shape as /healthz). Omitted when no collector runs, so a graph of
            zeroes never implies an archive that exists and is doing nothing.
          items:
            $ref: "#/components/schemas/PriceHealth"
        backup:
          allOf:
            - $ref: "#/components/schemas/BackupHealth"
          description: >-
            Offsite-backup state for the price archive; omitted when none is
            configured. `successes`/`failures` are the counters to alert on — the
            timestamps need a notion of "too old", which /healthz already applies.

    Series:
      type: object
      description: >
        One line/bar: a labelled, room/class-tagged set of per-bucket arrays
        (each of length len(buckets)) plus window totals.
      properties:
        key:
          type: string
          description: >
            Series identity (device id, room id, floor id, class, the reserved
            "house" coverage key, or "monitored"/"unmonitored"/"meter"). Always an
            id — only label varies with what the floorplan publishes.
        label:
          type: string
          description: >
            Display label. For a device, its display_name (id as fallback). For a
            grouped place series (room, floor), the floorplan's NAME when it
            publishes one and the key itself otherwise — never a label derived
            from the id.
        room:
          type: string
          description: >
            Floorplan room id. Set for a per-device series (the room the device
            sits in) and for a group_by=room series (the room it IS, so it can be
            joined to GET /rooms). Empty for floor, class, and the reserved
            "house" and "unmonitored" series, which belong to no single room —
            "house" is a coverage scope that GET /rooms never lists, so it is
            never reported here as one.
        class:
          type: string
        kwh:
          type: array
          items:
            type: number
          description: >
            Per-bucket energy (kWh), aligned to buckets. Every value covers only
            the part of its bucket that lies INSIDE [from, to): the first and last
            buckets may therefore be partial (see `buckets`), and a partial bucket
            carries proportionally less energy than a full one. Summing kwh gives
            total_kwh. For a COUNTER-CLASS device (every plug class, and the
            meter) total_kwh equals GET /devices/{id}/energy kwh over the same
            window: both are the same reset-safe counter reduction anchored at the
            first reading at or after `from`. A bucket such a device did not report
            in is 0, and the energy accrued meanwhile appears in the next bucket
            that has a reading. A ups_sensor has no counter, so both endpoints
            ESTIMATE its integral — the same way, per bucket here and over the
            whole window there — but they are close rather than identical. They
            differ where the load steps across a bucket boundary, by at most half
            that step times the gap between the readings straddling it, and less
            the more evenly those readings straddle it; and a
            bucket the device reported nothing in publishes 0, while the
            whole-window integral interpolates across the outage and counts it.
        cost:
          type: array
          items:
            type: number
          description: Per-bucket VAT-inclusive GBP cost, aligned to buckets.
        avg_w:
          type: array
          items:
            type: number
          description: >
            Per-bucket mean power (W); summed across members for aggregated
            groups. For counter-class devices this is the mean of the readings in
            the bucket. For a ups_sensor and for the synthetic "unmonitored"
            series it is energy-derived (kwh x 1000 / bucket hours), i.e. the
            bucket's TIME-weighted mean power, so it always agrees with the kwh
            beside it. The two coincide for a steady load on a regular cadence.
            A bucket with no telemetry reads 0; there is no "unknown" value.
        total_kwh:
          type: number
        total_cost:
          type: number
      required: [key, label, kwh, cost, avg_w, total_kwh, total_cost]

    Limits:
      type: object
      description: >
        The numbers behind a cap refusal, carried beside the prose message.


        The messages say what is wrong, why the constraint exists and what to do
        instead — they are not the problem. The problem is that they are unusable
        as DATA: /series states its cap in BUCKETS (so the window length it allows
        depends on the interval asked for) while the price routes state theirs in
        DAYS, and a caller chunking one query across both had no way to reconcile
        the two. `max_window_seconds` is the same key in the same unit on both, so
        one auto-chunking routine can read either.
      properties:
        max_window_seconds:
          type: integer
          description: >
            The cap as a window LENGTH. Omitted for a calendar interval, whose
            real length varies with DST and month length — a single number would
            be a lie, and this field exists to be arithmetic a caller can trust.
        max_buckets:
          type: integer
          description: /series only.
        buckets:
          type: integer
          description: /series only — how many the request would have yielded.
        interval:
          type: string
          description: /series only — the interval asked for.
        suggested_interval:
          type: string
          description: /series only — the finest allowed interval that would fit.
        allowed_intervals:
          type: array
          items: { type: string }
          description: >
            /series only, and present on the OTHER interval rejection: the whole
            accepted set, smallest first, so a client can pick without knowing the
            vocabulary in advance.


            It is here because both refusals arrive from the same endpoint. A
            caller discovering constraints programmatically meets the cap breach
            and the enum rejection, and getting structure from one and a sentence
            from the other means it still has to parse prose — which is what this
            block exists to stop.
        max_days:
          type: integer
          description: Price routes only.
        days:
          type: number
          description: Price routes only — the window asked for.

    Costed:
      type: object
      description: One priced view of a window. All money is VAT-inclusive GBP.
      properties:
        label:
          type: string
          description: What to call this in a UI; "actual" for the real bill.
        tariff_codes:
          type: array
          items: { type: string }
          description: >
            The tariffs behind it, when known. Plural because a window may span a
            switchover.
        kwh:
          type: number
          description: >
            The energy the comparison is over, at the requested scope. Every
            alternative is priced on this same figure — a counterfactual changes
            the price, not the consumption.
        energy_cost: { type: number }
        standing_charge: { type: number }
        total: { type: number }
      required: [label, kwh, energy_cost, standing_charge, total]

    CompareDelta:
      type: object
      description: >
        actual MINUS the alternative, per component. Negative means the actual was
        cheaper.


        Split rather than a single number because omitting the standing-charge
        difference was one of the two baseline errors this endpoint exists to
        prevent. `energy + standing == total` ALWAYS, including after rounding for
        the wire — a much stronger guarantee than a sentence in the docs.
      properties:
        energy:   { type: number }
        standing: { type: number }
        total:    { type: number }
      required: [energy, standing, total]

    CompareAlternative:
      allOf:
        - $ref: "#/components/schemas/Costed"
        - type: object
          properties:
            kind:
              type: string
              enum: [flat, tariff, window_mean]
            available_now:
              type: boolean
              description: >
                Whether this is something that could be bought today, from the
                agreement's own dates against the service clock.


                OMITTED where availability does not apply — a rate off a letter
                has no dates, nor does the window's own mean. Present and false is
                therefore a statement that the comparator has lapsed, which is the
                expired-baseline error made impossible to miss.
            available_note:
              type: string
              description: Why it is not available, when it is not.
            delta:
              $ref: "#/components/schemas/CompareDelta"
            verdict:
              type: string
              enum: [actual_cheaper, alternative_cheaper, level]
              description: >
                The sign of delta.total, so a consumer does not have to decide
                which direction is good. `level` covers a dead band of one
                hundredth of a penny: below that, reporting a winner would be
                noise dressed as a finding.
          required: [kind, delta, verdict]

    CompareResponse:
      type: object
      properties:
        window: { type: string }
        from:   { type: string, format: date-time }
        to:     { type: string, format: date-time }
        days:
          type: number
          description: >
            Window length in FRACTIONAL days. Standing charges are pro-rated on
            it, so a part-day window does not flatter or penalise an alternative
            for a reason unrelated to the tariff.
        scope:
          type: string
          enum: [household, monitored]
        currency: { type: string, example: GBP }
        actual:
          $ref: "#/components/schemas/Costed"
        alternatives:
          type: array
          items:
            $ref: "#/components/schemas/CompareAlternative"
      required: [window, from, to, days, scope, currency, actual, alternatives]

    ClampReport:
      type: object
      description: >
        Why the parts of a decomposition do not sum exactly to the meter.


        The "unmonitored" series is clamp(meter − monitored) PER BUCKET, so a
        bucket where monitored exceeds the meter contributes its excess to the
        catch-all instead of cancelling. Over a window the grouped parts plus the
        catch-all therefore overshoot the meter — by a few pence on a real home,
        small enough to look like float noise and not that.


        PRESENT ONLY WHEN THE CLAMP MOVED ENERGY, so its absence is the positive
        assertion that the parts sum exactly — the same convention as
        `unpriced_kwh`. That reading holds only on a server that HAS this field:
        one predating it omits the block for a different reason, and the two are
        the same bytes. Check this document rather than a response to tell them
        apart. Carried on both `shape=columns` and `shape=rows`, because
        shape is a rendering choice and must not change what a response explains.


        The two bucket counts are separate on purpose. `buckets` counts every
        clamped bucket and is the honest denominator for the gap; `drift_buckets`
        counts only those beyond one counter quantum (0.1 kWh), which is the
        data-quality alarm — a monitored device over-counting, a mis-scaled meter,
        skewed clocks. `drift_buckets: 0` with a non-zero `buckets` means the gap
        is entirely routine quantisation.
      properties:
        kwh:
          type: number
          description: >
            Total energy the clamp added to the "unmonitored" series. Exactly the
            amount by which the parts exceed the meter.
        buckets:
          type: integer
          description: Buckets clamped at all, either band.
        drift_buckets:
          type: integer
          description: >
            Subset of `buckets` beyond one counter quantum: the alarm band.
      required: [kwh, buckets, drift_buckets]

    SeriesResponse:
      type: object
      description: >
        Columnar energy time-series: a shared bucket time axis plus per-series
        value arrays that all align to it.
      properties:
        window:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        interval:
          type: string
          enum: [5m, 15m, 30m, 1h, 6h, 1d]
        group_by:
          type: string
          enum: [device, room, class, house]
        shape:
          type: string
          enum: [columns]
          description: Always "columns" for this schema.
        coverage:
          type: number
          description: >
            group_by=house only: monitored ÷ meter energy for the window (0..1).
            Omitted for other groupings and when no meter is configured. A low
            value means much of the home is unmonitored — or that monitored is
            under-counted (see stale_monitored_count).
        stale_monitored_count:
          type: integer
          description: >
            group_by=house only — including GET /devices/unmonitored/series, which
            derives its values from the house decomposition but reports group_by
            "device" and therefore omits this: count of monitored devices that
            reported NO power telemetry in the window (likely dropped/offline).
            Their load shifts
            into the "unmonitored" series, inflating it, so a non-zero value flags
            a low-confidence split. Omitted for other groupings / no meter.
            A device whose buckets came back empty counts here: an unreported
            bucket arrives from Influx as a null and is recognised as absent
            rather than as a reading of 0 W. A device that really did report 0 W
            is reporting, and is not counted.
        stale_monitored_ids:
          type: array
          items:
            type: string
          description: Ids of the stale monitored devices; omitted when none.
        clamp:
          allOf:
            - $ref: "#/components/schemas/ClampReport"
          description: >
            Present only when clamping moved energy, i.e. when the parts do NOT
            sum to the meter. Unlike coverage and stale_monitored_*, this is NOT
            house-only: the catch-all added by include_unmonitored is clamped the
            same way. Absent under unclamped=true, where no clamp is applied.
        prices:
          type: array
          description: >
            VAT-inclusive price behind each bucket, ALIGNED TO buckets[]:
            len(prices) == len(buckets), same order, always. Present only with
            prices=true.


            A null entry means NO RATE IS HELD for that bucket, never free — the
            same distinction the cost path draws when it reports unpriced_kwh.


            CONTRACT: `cost[i] == kwh[i] × prices[i]` holds only when
            `price_basis` is "slot". At coarser buckets the cost accumulates on
            the rate grid while the reported price is a time-weighted mean, so the
            identity is deliberately false there.
          items:
            type: number
            nullable: true
        price_unit:
          type: string
          example: GBP/kWh
          description: >
            Pounds per kWh — NOT the pence the /prices family speaks. This array
            sits beside cost[] and kwh[] in the same response, and consistency
            inside one payload beats consistency with a different endpoint.
        price_vat_included:
          type: boolean
        price_basis:
          type: string
          enum: [slot, mean_over_bucket, flat]
          description: >
            How each value was arrived at. "slot": the bucket sits inside one rate
            interval, so the value is that interval's own rate, exact.
            "mean_over_bucket": the bucket spans several, so the value is the
            TIME-weighted mean across them — not energy-weighted, which is
            cost÷kwh and undefined in a zero-kWh bucket. "flat": one rate covers
            all time. A bucket is priced under mean_over_bucket only when EVERY
            interval inside it is priced; otherwise it is null, because a mean
            over the slots that happen to be held is a plausible-looking wrong
            number.
        unpriced_buckets:
          type: integer
          description: >
            Count of null entries in prices[]. Sent even when 0, because 0 is the
            assertion a consumer wants: this window is fully priced.


            A bucket is priced over the part of it the WINDOW covers, not over
            its nominal span. The axis is built on calendar boundaries, so a
            custom window starting mid-bucket has a first bucket labelled before
            the window begins — and its kwh and cost already describe only the
            covered part, so its price must too. Pricing the nominal span asked
            about an instant outside the window, which reported a fully priced
            bucket as null and counted it here.
        tariff_codes:
          type: array
          items:
            type: string
          description: >
            Every tariff the window touches, in order, de-duplicated. Plural
            because a /series window MAY span a switchover: /prices refuses one,
            since a curve is a property of a single tariff, but a per-bucket array
            is not a curve — each bucket belongs to exactly one tariff, so every
            value is honest.


            FIXED agreements are named too. Each entry is the supplier tariff code
            where there is one, the agreement's own id otherwise, and its name when
            a fixed block carries neither — so `len(tariff_codes)` can be trusted
            as the number of tariffs in the window, which is the natural reading of
            a plural array.


            De-duplicated by that label, so a VAT-only agreement split — two blocks
            describing one tariff, as in the zero-rate runbook — collapses to one
            entry. Curve identity is what makes a tariff change, not block count.


            Absent only for a legacy single-rate document carrying neither a code
            nor a name, where there is genuinely no identity to report.
        buckets:
          type: array
          items:
            type: string
            format: date-time
          description: >
            Local-timezone bucket-start axis every series aligns to. Starts are
            GRID-ALIGNED — anchored at local midnight and stepped by `interval` —
            matching Influx's aggregation boundaries, so for an off-grid `from`
            the FIRST timestamp precedes `from` (e.g. from=14:29 with interval=30m
            yields a first bucket of 14:00). That bucket is a PARTIAL bucket: it is
            labelled by the grid boundary it starts on but its values cover only
            14:29 onwards, exactly as the last bucket covers only up to `to`.
            Buckets are also real wall-clock lengths, so a 1d bucket spanning a DST
            change is 23h or 25h.
        series:
          type: array
          description: >
            One entry per series in the grouping. Always an array — a grouping
            that matched nothing is [], never null, so a consumer can tell an
            empty grouping from a missing field.
          items:
            $ref: "#/components/schemas/Series"
      required: [window, from, to, interval, group_by, shape, buckets, series]

    SeriesMeta:
      type: object
      description: Per-series metadata for the row-oriented shape (no per-bucket arrays).
      properties:
        key:
          type: string
          description: >
            Series identity (device id, room id, floor id, class, the reserved
            "house" coverage key, or "monitored"/"unmonitored"/"meter"). Always an
            id — only label varies with what the floorplan publishes.
        label:
          type: string
          description: >
            Display label. For a device, its display_name (id as fallback). For a
            grouped place series (room, floor), the floorplan's NAME when it
            publishes one and the key itself otherwise — never a label derived
            from the id.
        room:
          type: string
          description: >
            Floorplan room id. Set for a per-device series (the room the device
            sits in) and for a group_by=room series (the room it IS, so it can be
            joined to GET /rooms). Empty for floor, class, and the reserved
            "house" and "unmonitored" series, which belong to no single room —
            "house" is a coverage scope that GET /rooms never lists, so it is
            never reported here as one.
        class:
          type: string
        total_kwh:
          type: number
        total_cost:
          type: number
      required: [key, label, total_kwh, total_cost]

    SeriesPoint:
      type: object
      description: One (series, bucket) sample in the row-oriented shape.
      properties:
        key:
          type: string
          description: Series identity this row belongs to.
        time:
          type: string
          format: date-time
          description: >
            Bucket start (local timezone offset). Grid-aligned, so the first row's
            time may precede `from` — see SeriesResponse.buckets.
        kwh:
          type: number
          description: >
            Energy in the part of the bucket inside [from, to). The first and last
            buckets may be partial.
        cost:
          type: number
          description: VAT-inclusive GBP cost.
        avg_w:
          type: number
          description: >
            Mean power over the in-window part of the bucket (W). Energy-derived
            (and so time-weighted) for a ups_sensor and for "unmonitored" — see
            Series.avg_w.
      required: [key, time, kwh, cost, avg_w]

    RowsResponse:
      type: object
      description: >
        Row-oriented ("tidy"/long) energy time-series: a flat list of one row per
        (series, bucket), plus lightweight per-series metadata. Rows are ordered by
        series then bucket time. Idiomatic for Codable consumers (decode the rows
        array of structs) and grouped native charts (e.g. Swift Charts).
      properties:
        window:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        interval:
          type: string
          enum: [5m, 15m, 30m, 1h, 6h, 1d]
        group_by:
          type: string
          enum: [device, room, class, house]
        shape:
          type: string
          enum: [rows]
          description: Always "rows" for this schema.
        coverage:
          type: number
          description: >
            group_by=house only: monitored ÷ meter energy for the window (0..1).
            Omitted for other groupings / no meter. See SeriesResponse.coverage.
        stale_monitored_count:
          type: integer
          description: >
            group_by=house only: count of monitored devices with no power telemetry
            in the window. See SeriesResponse.stale_monitored_count.
        stale_monitored_ids:
          type: array
          items:
            type: string
          description: Ids of the stale monitored devices; omitted when none.
        clamp:
          allOf:
            - $ref: "#/components/schemas/ClampReport"
          description: >
            Mirrors SeriesResponse.clamp — shape must not change what a response
            explains.
        prices:
          type: array
          description: >
            Mirrors SeriesResponse.prices. Still aligned to the BUCKET axis, not
            to rows: a row is one (series, bucket) pair, so per-row prices would
            repeat each value once per series.


            A null entry means NO RATE IS HELD for that bucket, never free — the
            same distinction the cost path draws when it reports unpriced_kwh.


            CONTRACT: `cost[i] == kwh[i] × prices[i]` holds only when
            `price_basis` is "slot". At coarser buckets the cost accumulates on
            the rate grid while the reported price is a time-weighted mean, so the
            identity is deliberately false there.
          items:
            type: number
            nullable: true
        price_unit:
          type: string
          example: GBP/kWh
          description: >
            Pounds per kWh — NOT the pence the /prices family speaks. This array
            sits beside cost[] and kwh[] in the same response, and consistency
            inside one payload beats consistency with a different endpoint.
        price_vat_included:
          type: boolean
        price_basis:
          type: string
          enum: [slot, mean_over_bucket, flat]
          description: >
            How each value was arrived at. "slot": the bucket sits inside one rate
            interval, so the value is that interval's own rate, exact.
            "mean_over_bucket": the bucket spans several, so the value is the
            TIME-weighted mean across them — not energy-weighted, which is
            cost÷kwh and undefined in a zero-kWh bucket. "flat": one rate covers
            all time. A bucket is priced under mean_over_bucket only when EVERY
            interval inside it is priced; otherwise it is null, because a mean
            over the slots that happen to be held is a plausible-looking wrong
            number.
        unpriced_buckets:
          type: integer
          description: >
            Count of null entries in prices[]. Sent even when 0, because 0 is the
            assertion a consumer wants: this window is fully priced.
        tariff_codes:
          type: array
          items:
            type: string
          description: >
            Every tariff the window touches, in order, de-duplicated. Plural
            because a /series window MAY span a switchover: /prices refuses one,
            since a curve is a property of a single tariff, but a per-bucket array
            is not a curve — each bucket belongs to exactly one tariff, so every
            value is honest.


            FIXED agreements are named too. Each entry is the supplier tariff code
            where there is one, the agreement's own id otherwise, and its name when
            a fixed block carries neither — so `len(tariff_codes)` can be trusted
            as the number of tariffs in the window, which is the natural reading of
            a plural array.


            De-duplicated by that label, so a VAT-only agreement split — two blocks
            describing one tariff, as in the zero-rate runbook — collapses to one
            entry. Curve identity is what makes a tariff change, not block count.


            Absent only for a legacy single-rate document carrying neither a code
            nor a name, where there is genuinely no identity to report.
        series:
          type: array
          items:
            $ref: "#/components/schemas/SeriesMeta"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/SeriesPoint"
      required: [window, from, to, interval, group_by, shape, series, rows]

    Event:
      type: object
      description: A single state transition at a point in time.
      properties:
        time:
          type: string
          format: date-time
        from:
          type: string
          description: Raw device_activity from-label (e.g. "idle").
        to:
          type: string
          description: Raw device_activity to-label (e.g. "active").
        on:
          type: boolean
          description: >
            Normalized on/off state derived from the to-label. Omitted when the
            label is not a known on/off state (a momentary/unknown event).
      required: [time, from, to]

    Interval:
      type: object
      description: A sustained ON span over the window.
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
          nullable: true
          description: End of the span, or null when still open at the window end.
        state:
          type: string
          description: Raw label of the span.
        on:
          type: boolean
        duration_s:
          type: number
          description: Window-clamped span length in seconds.
        open:
          type: boolean
          description: True when the span is still in progress at the window end.
      required: [start, state, duration_s]

    Stats:
      type: object
      description: Summary of ON intervals over the window.
      properties:
        on_count:
          type: integer
        total_on_seconds:
          type: number
        duty:
          type: number
          description: total_on_seconds divided by the window length in seconds.
      required: [on_count, total_on_seconds, duty]

    DeviceEventsResponse:
      type: object
      properties:
        device_id:
          type: string
        window:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        events:
          type: array
          items:
            $ref: "#/components/schemas/Event"
      required: [device_id, window, from, to, events]

    DeviceIntervalsResponse:
      type: object
      properties:
        device_id:
          type: string
        window:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        state_at_start:
          type: string
          description: Raw carry-in state the device was in as the window opened.
        intervals:
          type: array
          items:
            $ref: "#/components/schemas/Interval"
        stats:
          $ref: "#/components/schemas/Stats"
      required: [device_id, window, from, to, state_at_start, intervals, stats]

    EventSeries:
      type: object
      description: One multi-device /events series (per device or per class).
      properties:
        key:
          type: string
          description: Series identity (device id or class).
        label:
          type: string
        class:
          type: string
        events:
          type: array
          items:
            $ref: "#/components/schemas/Event"
      required: [key, label, class, events]

    EventsResponse:
      type: object
      description: Columnar multi-device event overlay.
      properties:
        window:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        group_by:
          type: string
          enum: [device, class]
        series:
          type: array
          items:
            $ref: "#/components/schemas/EventSeries"
      required: [window, from, to, group_by, series]

    DeviceCatalogEntry:
      type: object
      description: One device catalog row.
      properties:
        id:
          type: string
        display_name:
          type: string
        room:
          type: string
          description: >
            Floorplan room id. Empty for a device whose readings describe the whole
            property rather than a room; see covers.
        floor:
          type: string
          description: >
            Floor id as DECLARED by the devices namespace, e.g. "floor2". Empty
            when the namespace declares none — never derived from the room id's
            "<floor>.<slug>" shape, since the floorplan owns that fact. Join to
            /floors for its name, storey order and elevation.
        covers:
          type: string
          description: >
            Set when the device's readings describe the whole property rather than
            the room it sits in, which is why its room may be empty.
        class:
          type: string
        capabilities:
          type: array
          items:
            type: string
            enum: [energy, events]
          description: Derived capability hints ("energy" for metered classes, "events" for event-bearing classes — binary_state_device, fire_alarm).
      required: [id, display_name, room, floor, class, capabilities]

    DevicesCatalog:
      type: object
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/DeviceCatalogEntry"
      required: [devices]

    FloorCatalogEntry:
      type: object
      description: One floor catalog row.
      properties:
        id:
          type: string
          description: Floor id — the value to pass back as floors=, and the value devices carry in their `floor` property.
          example: floor1
        name:
          type: string
          description: >
            The floorplan's display label, empty when it declares none. Reported
            empty rather than title-cased from the id.
          example: Floor One
        order:
          type: integer
          nullable: true
          description: >
            Storey position, ascending from the lowest. NULL when the floorplan
            declares none — nullable rather than defaulted because 0 is a
            legitimate order (a basement), so it cannot double as "undeclared".
            Floor ids do not sort into building order, so without this every
            client hardcodes its own storey sequence.
          example: 1
        elevation:
          type: number
          format: double
          nullable: true
          description: Metres above the site datum, null when undeclared (0.0 is a real elevation).
          example: 0.0
        device_count:
          type: integer
          description: Metered devices declaring this floor. Always >= 1 — a floor with none is not listed.
      required: [id, name, order, elevation, device_count]

    FloorsCatalog:
      type: object
      properties:
        fetched_at:
          type: string
          format: date-time
          description: See TariffsResponse.fetched_at. Omitted when nothing to report.
        stale:
          type: boolean
          description: See TariffsResponse.stale. Omitted when nothing to report.
        floors:
          type: array
          items:
            $ref: "#/components/schemas/FloorCatalogEntry"
      required: [floors]

    RoomCatalogEntry:
      type: object
      description: One room catalog row.
      properties:
        id:
          type: string
          description: >
            Floorplan room id — the value to pass back as rooms=, and the value
            devices carry in their `room` property. It is the key: NAMES ARE NOT
            UNIQUE, since two rooms on different floors may share one.
          example: floor1.room-a
        name:
          type: string
          description: The floorplan's display label, empty when it declares none.
          example: Room A
        floor:
          type: string
          description: >
            Floor id the floorplan puts this room on, empty when it declares
            none. Relayed from the ROOM record — never read out of the id's
            "<floor>.<slug>" shape, and never inferred from the floors this
            room's devices declare. NOT guaranteed to appear in /floors: that
            listing is built from the floors DEVICES declare, and countinghouse
            does not arbitrate between two upstream declarations. A client
            joining the two must handle a miss.
          example: floor1
        category:
          type: string
          description: >
            The room's purpose as the floorplan classifies it (e.g. "kitchen",
            "circulation", "plant"), empty when it declares none. Relayed raw and
            deliberately not reduced to a computed flag: which rooms "count" is a
            per-dashboard policy question, and a breakdown, a coverage view and a
            heat-loss view answer it differently.
          example: utility
        area:
          type: number
          format: double
          nullable: true
          description: Floor area in square metres, null when undeclared.
          example: 12.4
        device_count:
          type: integer
          description: Metered devices attributed to this room. Always >= 1 — a room with none is not listed.
      required: [id, name, floor, category, area, device_count]

    RoomsCatalog:
      type: object
      properties:
        fetched_at:
          type: string
          format: date-time
          description: See TariffsResponse.fetched_at. Omitted when nothing to report.
        stale:
          type: boolean
          description: See TariffsResponse.stale. Omitted when nothing to report.
        rooms:
          type: array
          items:
            $ref: "#/components/schemas/RoomCatalogEntry"
      required: [rooms]

    HealthResponse:
      type: object
      properties:
        reasons:
          type: array
          items:
            type: string
          description: >-
            Why the status is not ok, one entry per failing condition, sorted. Omitted when
            everything is fine. Both verdict functions computed a reason and both callers
            discarded it, so an operator saw "degraded" with no indication which of four
            conditions caused it.
        status:
          type: string
          enum: [ok, degraded, unavailable]
          description: >-
            Aggregated downstream verdict. ok = all downstreams healthy;
            degraded = serving last-known-good config because a remote-config
            fetch is failing (remote_config.*.ok = false), OR the price archive
            cannot price today (see `prices`), OR the archive's offsite backup is
            failing, has never succeeded, or is stale (see `backup`); unavailable = Influx is
            unreachable (data routes will 502). The HTTP status is 200 in all
            three cases — /healthz reports health, it does not itself fail.
            On a running instance, degraded always means STALE and never EMPTY: a
            namespace that has never been fetched aborts startup instead, so any
            snapshot being served has landed at least once.
          example: ok
        version:
          type: string
        started_at:
          type: string
          format: date-time
        started_ago:
          type: integer
          description: Seconds since the server started.
        goroutines:
          type: integer
        influx_reachable:
          type: boolean
        site:
          type: object
          description: >-
            The site config this instance resolved: which property it serves and
            where it reads that property's devices from. Omitted on an instance
            that predates the per-site split, which is not a fault.
          properties:
            id:
              type: string
              example: home
            devices_namespace:
              type: string
              example: devices_home
            floorplan_namespace:
              type: string
              description: >-
                The floorplan namespace (floors, rooms) this instance reads. Like
                devices_namespace it is required, so a running instance always has
                one. Reported so an operator can see which property's floorplan it
                serves, and so blank names are attributable — remote_config cannot
                draw that distinction, since it only records the outcome of a
                fetch.
              example: floorplan_home
        prices:
          type: array
          description: >-
            Price-archive health, one entry per half-hourly tariff being
            collected. OMITTED ENTIRELY when no collector runs, which is the
            normal state for a deployment whose tariff agreements are all
            flat-rate — an empty array would read as a broken archive rather than
            as no archive.


            REDACTED relative to the same field on /metrics: /healthz is
            unauthenticated, so the upstream's own error text is withheld and
            `last_error_class` carries the failure.
          items:
            $ref: "#/components/schemas/PriceHealthRedacted"
        backup:
          allOf:
            - $ref: "#/components/schemas/BackupHealthRedacted"
          description: >-
            Offsite-backup state for the price archive. OMITTED ENTIRELY when no
            backup is configured, which is the normal state in development and on
            any deployment with no archive — a zeroed block would read as a broken
            backup rather than as no backup.


            REDACTED relative to /metrics: an anonymous caller learns whether the
            backup is working, not which bucket it lands in.
        remote_config:
          type: object
          description: >-
            Per-namespace status of the most recent remote-config fetch, keyed by
            the namespace actually read. The devices key follows
            site.devices_namespace, which is required — there is no default, and a
            config naming no namespace refuses to start. A monitor keyed on a
            literal namespace therefore stops matching when a site migrates, and a
            missing key reads as healthy in most check expressions. Alert on the
            top-level `status` field instead, which degrades regardless of the key.
            `energy_tariffs` is fixed, and the floorplan key follows
            `site.floorplan_namespace`, which is required too. Omitted when no
            remote-config fetcher is wired.
          additionalProperties:
            type: object
            properties:
              ok:
                type: boolean
              fetched_at:
                type: string
                format: date-time
              error:
                type: string
      required: [status, started_at, started_ago, goroutines, influx_reachable]
