openapi: 3.0.3
info:
  title: Countinghouse API
  description: >
    Read-side energy cost/accounting HTTP API. Turns per-device telemetry into
    windowed kWh and cost. All endpoints except /healthz and /openapi.json
    require a Bearer JWT (user or service token) issued by the configured
    identity service.
  version: "0.2.0"
  contact:
    name: Martin Sweeney
    email: martin@sweeney.io
    url: https://github.com/sweeney/countinghouse
  license:
    name: Proprietary
    url: https://github.com/sweeney/countinghouse
servers:
  - url: __PUBLIC_URL__

security:
  - bearerAuth: []

tags:
  - name: data
    description: Energy, cost, bill, series and event endpoints (require a Bearer JWT).
  - name: system
    description: Health and API spec endpoints.

# Every response carries permissive CORS headers (Access-Control-Allow-Origin: *)
# and Timing-Allow-Origin: *, so browser consumers on any origin can call the API
# and read real PerformanceResourceTiming phases rather than zeroed ones. Safe as
# a wildcard because the API authenticates by Bearer token, not cookies.

paths:
  /healthz:
    get:
      summary: Health check
      description: Returns server health, Influx reachability, and (later) remote config fetch status. No auth required.
      operationId: getHealth
      security: []
      tags: [system]
      responses:
        "200":
          description: Server is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /openapi.json:
    get:
      summary: OpenAPI spec
      description: This spec document, as JSON. No auth required.
      operationId: getOpenAPISpec
      security: []
      tags: [system]
      responses:
        "200":
          description: OpenAPI 3.0 spec
          content:
            application/json:
              schema:
                type: object

  /devices/{id}/energy:
    get:
      summary: Device energy
      description: >
        Windowed kWh consumed by one device. Routing is class-derived: plug
        classes use the reset-safe counter path (source "counter"); ups_sensor
        uses the power integral (source "integral"). Non-metered classes return
        400.
      operationId: getDeviceEnergy
      tags: [data]
      parameters:
        - $ref: "#/components/parameters/DeviceID"
        - $ref: "#/components/parameters/Window"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Windowed energy for the device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceEnergyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /devices/{id}/cost:
    get:
      summary: Device cost
      description: >
        Windowed kWh and VAT-inclusive GBP cost for one device, at the tariff
        effective at the window start.
      operationId: getDeviceCost
      tags: [data]
      parameters:
        - $ref: "#/components/parameters/DeviceID"
        - $ref: "#/components/parameters/Window"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Windowed cost for the device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceCostResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"

  /series:
    get:
      summary: Energy time-series
      description: >
        Multi-series energy time-series over the window: per-series kWh, cost and
        avg_w. group_by selects device (default, one series per metered device,
        excluding the whole-house meter), room, floor, class, or house. A floor is
        the sum of its rooms — energy is additive, so sum is the only combining
        statistic and there is no group_fn. Grouped place series (room, floor) are
        labelled with the floorplan's NAME when it publishes one and by their id
        otherwise; the key is always the id. rooms= and floors= narrow which
        devices the response covers. house yields
        three series in order: "monitored" = sum of devices, "unmonitored" =
        clamp(meter − monitored) per bucket (the rest-of-home energy no monitored
        device accounts for), and "meter" = the whole-house meter. Stacking every
        series except "meter" reconstructs the whole home; monitored + unmonitored
        == meter per bucket within rounding tolerance (a slightly-negative residual
        from counter quantisation clamps to 0). unmonitored cost is the tariff
        applied to its clamped energy. The house response also carries top-level
        coverage (monitored ÷ meter) and a stale-monitored-device indicator
        (count + ids) so consumers can gauge how trustworthy the split is. For
        device/room/class groupings, include_unmonitored=true adds the same
        rest-of-home quantity as a single catch-all series so those parts sum to
        the meter too. The shape param chooses columnar (default) or row-oriented
        output.
      operationId: getSeries
      tags: [data]
      parameters:
        - $ref: "#/components/parameters/Window"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Interval"
        - $ref: "#/components/parameters/GroupBy"
        - $ref: "#/components/parameters/RoomsFilter"
        - $ref: "#/components/parameters/FloorsFilter"
        - $ref: "#/components/parameters/IncludeUnmonitored"
        - $ref: "#/components/parameters/Unclamped"
        - $ref: "#/components/parameters/Shape"
      responses:
        "200":
          description: >
            Energy time-series. shape=columns → SeriesResponse (shared buckets
            axis + per-series arrays); shape=rows → RowsResponse (flat rows).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SeriesResponse"
                  - $ref: "#/components/schemas/RowsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"

  /devices/{id}/series:
    get:
      summary: Device energy time-series
      description: >
        Single-device convenience form of /series: the same response shapes
        carrying exactly one series for the device. Non-metered classes return
        400. Every energy-capable device in /devices is served, INCLUDING the
        whole-house meter: it is excluded from /series?group_by=device because
        it would double-count against the plugs it measures, but a request for a
        single device cannot double-count, and its series here is identical to
        the "meter" series of group_by=house. The response always carries exactly
        one series and group_by reads "device"; a build that produced none is an
        internal inconsistency and returns 500 rather than 200 with an empty
        series list. The shape param chooses columnar (default) or row-oriented
        output. rooms= and floors= are IGNORED here rather than rejected: they
        SELECT devices, and the path segment has already selected one, so they are
        redundant rather than contradictory (matching greenhouse's single-device
        endpoint).
        The reserved id "unmonitored" is a synthetic device serving the house
        "unmonitored" series (rest of home = clamp(meter − monitored)) through this
        same single-series shape; it returns 404 when no whole-house meter is
        configured (unmonitored is then undefined). For id=unmonitored the
        unclamped diagnostic param applies (ignored for real devices).
        Its body is the SAME schema as a real device's, house-only fields
        included: coverage, stale_monitored_count and stale_monitored_ids are
        absent here even though deriving unmonitored requires the whole-house
        decomposition. Those signals describe that decomposition rather than this
        series, and GET /series?group_by=house carries them beside the identical
        unmonitored values for a consumer that wants both.
      operationId: getDeviceSeries
      tags: [data]
      parameters:
        - $ref: "#/components/parameters/DeviceID"
        - $ref: "#/components/parameters/Window"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Interval"
        - $ref: "#/components/parameters/Unclamped"
        - $ref: "#/components/parameters/Shape"
      responses:
        "200":
          description: >
            Energy time-series for the device. shape=columns → SeriesResponse;
            shape=rows → RowsResponse.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SeriesResponse"
                  - $ref: "#/components/schemas/RowsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"

  /bill:
    get:
      summary: Electricity bill
      description: >
        Per-device cost breakdown plus standing charge, total, and
        reconciliation against the whole-house meter for the window.
      operationId: getBill
      tags: [data]
      parameters:
        - $ref: "#/components/parameters/Window"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Assembled bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /tariffs:
    get:
      summary: Current tariffs by fuel
      description: >
        All configured tariffs keyed by fuel (electricity, gas, ...). Rates are
        ex-VAT; vat_rate gives the gross-up. Countinghouse bills electricity
        today; gas is exposed for forward-compatibility with gas devices.
      operationId: getTariffs
      tags: [data]
      responses:
        "200":
          description: Tariffs keyed by fuel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TariffsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /metrics:
    get:
      summary: Service metrics
      description: Influx query counters and basic runtime info.
      operationId: getMetrics
      tags: [data]
      responses:
        "200":
          description: Metrics snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /devices:
    get:
      summary: Device catalog
      description: >
        Discovery catalog: a pass-through of the statehouse_devices namespace
        enriched with a derived capabilities hint ("energy" when the class is
        metered, "events" for event-bearing classes — binary_state_device,
        fire_alarm). Lets a UI build a device picker without knowing Influx.
        Sorted by id. When a whole-house meter is configured, a synthetic
        "unmonitored" entry (class "unmonitored", capability "energy", id reserved)
        is included so the rest-of-home series appears in pickers and plots through
        /devices/unmonitored/series like any device.
      operationId: getDevices
      tags: [data]
      responses:
        "200":
          description: Device catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicesCatalog"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /floors:
    get:
      summary: Floor catalog
      description: >
        The building's floors, and the discoverable vocabulary behind the
        `floors=` filter and `group_by=floor`. Lists exactly the floors at least
        one BILLED device declares (metered, excluding the whole-house meter),
        which is exactly the set `floors=` accepts — so a picker filled from this
        endpoint cannot build a request /series rejects. A floorplan record for a
        floor with no metered device is therefore not listed, and a floor devices
        declare that the floorplan has no record for IS listed, with its name
        empty and order null. Sorted by declared storey order ascending, then by
        id; floors with no declared order sort last. Reads the same floorplan
        namespace greenhouse serves /floors from, so both services answer in one
        vocabulary.
      operationId: getFloors
      tags: [data]
      responses:
        "200":
          description: Floor catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FloorsCatalog"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /rooms:
    get:
      summary: Room catalog
      description: >
        The building's rooms, and the discoverable vocabulary behind the `rooms=`
        filter and `group_by=room`. Listed on the same rule as /floors: exactly
        the rooms at least one billed device is attributed to. `category` is
        relayed RAW rather than reduced to a flag — a plant room's consumption is
        infrastructure rather than household usage, but which rooms "count" is a
        per-dashboard policy question. The reserved "house" key (a coverage
        scope, not a room) never appears. Sorted by floor storey order, then by
        room id; rooms whose floor is unknown sort last.
      operationId: getRooms
      tags: [data]
      responses:
        "200":
          description: Room catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomsCatalog"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /devices/{id}/events:
    get:
      summary: Device event timeline
      description: >
        Ordered state-transition edges for one device over the window
        (vertical-line overlays). Each event carries the raw from/to labels and
        a normalized on flag (omitted for momentary/unknown labels).
      operationId: getDeviceEvents
      tags: [data]
      parameters:
        - $ref: "#/components/parameters/DeviceID"
        - $ref: "#/components/parameters/Window"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Transition events for the device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceEventsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"

  /devices/{id}/intervals:
    get:
      summary: Device on/off intervals
      description: >
        Sustained ON spans for one device over the window (shaded bands), with
        the carry-in opening state (state_at_start), per-interval durations, an
        open flag for an in-progress span at the window end, and summary stats
        (on_count, total_on_seconds, duty).
      operationId: getDeviceIntervals
      tags: [data]
      parameters:
        - $ref: "#/components/parameters/DeviceID"
        - $ref: "#/components/parameters/Window"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Intervals and stats for the device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceIntervalsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"

  /events:
    get:
      summary: Multi-device event overlay
      description: >
        Categorical timeline overlay across a device set. The set comes from
        devices= (csv of ids; an unknown id is a 400), class= (all devices of a
        class), or the default (all event-bearing devices: binary_state_device,
        fire_alarm). group_by=device
        (default) yields one series per device; group_by=class merges every
        member device's events under each class key, time-ordered.
      operationId: getEvents
      tags: [data]
      parameters:
        - name: devices
          in: query
          required: false
          description: Comma-separated device ids to overlay. An unknown id is a 400.
          schema:
            type: string
        - name: class
          in: query
          required: false
          description: Restrict the set to devices of this class (ignored when devices= is given).
          schema:
            type: string
        - $ref: "#/components/parameters/Window"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: group_by
          in: query
          required: false
          description: How to group series. Defaults to "device".
          schema:
            type: string
            enum: [device, class]
            default: device
      responses:
        "200":
          description: Columnar multi-device event overlay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/BadGateway"

components:
  parameters:
    DeviceID:
      name: id
      in: path
      required: true
      description: Device id (key in the statehouse_devices namespace).
      schema:
        type: string
    Window:
      name: window
      in: query
      required: false
      description: >-
        Window spec. Defaults to "today". Period-to-date: today, week (from
        Monday), month (from the 1st) — all ending now. custom: an explicit
        from/to range. Rolling: "<N>d" is a trailing N calendar days ending now,
        DAY-ALIGNED to local midnight (e.g. 7d = today + the previous 6 days;
        1d == today); "<N>h" is an EXACT trailing N hours (e.g. 24h), not
        midnight-aligned. N is a positive integer.
      schema:
        type: string
        default: today
        pattern: '^(today|week|month|custom|[0-9]+[dh])$'
        example: 7d
    From:
      name: from
      in: query
      required: false
      description: >-
        Custom window start (RFC3339). Required when window=custom, and ONLY
        valid then — supplying from with any other window (period-to-date
        today/week/month or rolling <N>d/<N>h, which derive their own range) is
        rejected with 400.
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: false
      description: >-
        Custom window end (RFC3339). Required when window=custom, and ONLY
        valid then — supplying to with any other window (period-to-date
        today/week/month or rolling <N>d/<N>h, which derive their own range) is
        rejected with 400.
      schema:
        type: string
        format: date-time
    Interval:
      name: interval
      in: query
      required: false
      description: >
        Bucket granularity. Defaults smartly to the window (today→1h,
        week/month→1d, custom and rolling <N>d/<N>h→by span). An interval whose bucket count over the
        window exceeds the ~1000 cap returns 400 asking for a coarser interval.
        For window=custom whose from is not on an interval boundary, the bucket
        axis snaps DOWN to the interval grid anchored at local midnight (so it
        matches the aggregation boundaries); the first bucket is widened to that
        boundary. Period-to-date windows already start at local midnight and are
        unaffected.
      schema:
        type: string
        enum: [5m, 15m, 30m, 1h, 6h, 1d]
    GroupBy:
      name: group_by
      in: query
      required: false
      description: >
        How to group series. Defaults to "device". "floor" groups by the floor a
        device DECLARES (never one derived from its room id) and sums it, since
        energy is additive. A device whose readings describe the whole property
        groups under the reserved "house" key in both place groupings (room and
        floor) rather than being attributed to a place it does not describe.
      schema:
        type: string
        enum: [device, room, floor, class, house]
        default: device
    RoomsFilter:
      name: rooms
      in: query
      required: false
      description: >
        Comma-separated floorplan room ids; only devices in those rooms are
        covered. Composes with floors= as AND. An omitted parameter, or a bare
        `rooms=`, means no filter; a value carrying only separators or whitespace
        (`rooms=,,`) is rejected with 400 rather than silently widening to the
        whole house. A room holding no billed device is
        rejected with 400 rather than silently returning an unfiltered or empty
        answer — the accepted set is exactly what GET /rooms lists, so a picker
        filled from that catalog cannot produce a rejected request. The reserved
        "house" key is a coverage scope, not a room, and is rejected. CANNOT be
        combined with include_unmonitored=true or group_by=house (400): the
        unmonitored series is the meter minus ALL monitored devices, so against a
        filtered set it would absorb the excluded devices and report them as
        rest-of-home.
      schema:
        type: string
        example: floor1.room-a,floor2.room-b
    FloorsFilter:
      name: floors
      in: query
      required: false
      description: >
        Comma-separated floor ids; only devices declaring those floors are
        covered. The coarse sibling of rooms=, with the same rules: AND
        composition, 400 on a floor holding no billed device (the accepted set is
        exactly what GET /floors lists), and rejected alongside
        include_unmonitored=true or group_by=house.
      schema:
        type: string
        example: floor1
    IncludeUnmonitored:
      name: include_unmonitored
      in: query
      required: false
      description: >
        When true, a device/room/floor/class grouping gains exactly one extra
        "unmonitored" (rest-of-home) series so the parts sum to the whole-house
        meter. Never subdivided (one series regardless of grouping); a no-op when
        no meter is configured. Ignored for group_by=house (which always includes
        it). Under group_by=floor it is returned as its own series and is never
        attributed to a floor — the residual is house-scoped and belongs to no
        storey. Rejected with 400 alongside rooms= or floors=, since the residual
        is defined against the whole monitored fleet. Default false — the response
        is otherwise unchanged.
      schema:
        type: boolean
        default: false
    Unclamped:
      name: unclamped
      in: query
      required: false
      description: >
        Diagnostic mode: when true, the unmonitored series is the RAW signed
        residual (meter − monitored) with negatives preserved, instead of clamped
        at 0. Negative kWh/cost/avg_w can appear; this deliberately breaks the
        monitored+unmonitored==meter presentation, for investigating meter/device
        drift. Default false. (Operators also have the drift_buckets_total metric.)
      schema:
        type: boolean
        default: false
    Shape:
      name: shape
      in: query
      required: false
      description: >
        Response layout. "columns" (default) is the columnar SeriesResponse — a
        shared `buckets` axis plus per-series value arrays (ideal for web charting
        libraries). "rows" is the row-oriented RowsResponse — a flat `rows` list of
        one object per (series, bucket), idiomatic for Codable consumers and
        grouped native charts (e.g. Swift Charts). The 200 response schema is the
        corresponding SeriesResponse or RowsResponse.
      schema:
        type: string
        enum: [columns, rows]
        default: columns

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Missing or invalid Bearer JWT
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Invalid or missing query parameters, or device has no energy series
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Unknown device or absent tariff
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unavailable:
      description: No tariff configured
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Internal:
      description: >
        Server-side inconsistency — the request was valid and upstream answered,
        but the response could not be assembled (e.g. a device the class gate
        admits produced no series). Never returned in normal operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadGateway:
      description: Upstream Influx query failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    Tariff:
      type: object
      properties:
        unit_rate:
          type: number
          description: GBP per kWh, ex-VAT.
        daily_standing_charge:
          type: number
          description: GBP per day, ex-VAT.
        unit:
          type: string
        vat_rate:
          type: number

    TariffsResponse:
      type: object
      properties:
        currency:
          type: string
          example: GBP
        tariffs:
          type: object
          description: Tariffs keyed by fuel (e.g. electricity, gas).
          additionalProperties:
            $ref: "#/components/schemas/Tariff"

    DeviceEnergyResponse:
      type: object
      properties:
        device_id:
          type: string
        kwh:
          type: number
        source:
          type: string
          enum: [counter, integral]
        window:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
      required: [device_id, kwh, source, window, from, to]

    DeviceCostResponse:
      type: object
      properties:
        device_id:
          type: string
        kwh:
          type: number
        cost:
          type: number
        currency:
          type: string
          example: GBP
        window:
          type: string
        tariff:
          type: object
          properties:
            unit_rate:
              type: number
            vat_rate:
              type: number
      required: [device_id, kwh, cost, currency, window]

    DeviceCostBreakdown:
      type: object
      properties:
        device_id:
          type: string
        display_name:
          type: string
        room:
          type: string
          description: >
            Floorplan room id. Empty for a device whose readings describe the whole
            property rather than a room; see covers.
        floor:
          type: string
          description: >
            Floor id as DECLARED by the devices namespace, e.g. "floor2". Empty
            when the namespace declares none — never derived from the room id's
            "<floor>.<slug>" shape, since the floorplan owns that fact. Join to
            /floors for its name, storey order and elevation.
        covers:
          type: string
          description: >
            Set when the device's readings describe the whole property rather than the
            room it sits in, which is why its room may be empty.
        class:
          type: string
        kwh:
          type: number
        cost:
          type: number

    Reconciliation:
      type: object
      required: [meter_present, monitored_kwh]
      properties:
        meter_present:
          type: boolean
          description: >-
            Whether an energy_meter is configured. When false there is nothing
            to reconcile against, so meter_kwh, unmonitored_kwh and coverage are
            OMITTED (rather than reported as a misleading negative remainder /
            zero coverage).
        monitored_kwh:
          type: number
        meter_kwh:
          type: number
          description: >-
            Whole-house meter total. Present only when meter_present is true.
        unmonitored_kwh:
          type: number
          description: >-
            meter_kwh − monitored_kwh. Present only when meter_present is true.
        coverage:
          type: number
          description: >-
            Monitored fraction of meter; not clamped to [0,1]. Present only when
            meter_present is true.

    BillResponse:
      type: object
      properties:
        window:
          type: string
        currency:
          type: string
          example: GBP
        devices:
          type: array
          items:
            $ref: "#/components/schemas/DeviceCostBreakdown"
        energy_cost:
          type: number
        standing_charge:
          type: number
        total:
          type: number
        reconciliation:
          $ref: "#/components/schemas/Reconciliation"

    MetricsResponse:
      type: object
      properties:
        query_count:
          type: integer
        query_errors:
          type: integer
        influx_avg_latency_ms:
          type: number
        drift_buckets_total:
          type: integer
          description: >
            Cumulative count of negative-residual drift buckets (meter below
            monitored beyond the 0.1 kWh counter quantum) observed across served
            series requests. A growing value means the unmonitored decomposition is
            being distorted — investigate via WARN logs or unclamped=true.
        version:
          type: string
        uptime_seconds:
          type: integer
        goroutines:
          type: integer

    Series:
      type: object
      description: >
        One line/bar: a labelled, room/class-tagged set of per-bucket arrays
        (each of length len(buckets)) plus window totals.
      properties:
        key:
          type: string
          description: >
            Series identity (device id, room id, floor id, class, the reserved
            "house" coverage key, or "monitored"/"unmonitored"/"meter"). Always an
            id — only label varies with what the floorplan publishes.
        label:
          type: string
          description: >
            Display label. For a device, its display_name (id as fallback). For a
            grouped place series (room, floor), the floorplan's NAME when it
            publishes one and the key itself otherwise — never a label derived
            from the id.
        room:
          type: string
          description: >
            Floorplan room id. Set for a per-device series (the room the device
            sits in) and for a group_by=room series (the room it IS, so it can be
            joined to GET /rooms). Empty for floor, class, and the reserved
            "house" and "unmonitored" series, which belong to no single room —
            "house" is a coverage scope that GET /rooms never lists, so it is
            never reported here as one.
        class:
          type: string
        kwh:
          type: array
          items:
            type: number
          description: >
            Per-bucket energy (kWh), aligned to buckets. Every value covers only
            the part of its bucket that lies INSIDE [from, to): the first and last
            buckets may therefore be partial (see `buckets`), and a partial bucket
            carries proportionally less energy than a full one. Summing kwh gives
            total_kwh. For a COUNTER-CLASS device (every plug class, and the
            meter) total_kwh equals GET /devices/{id}/energy kwh over the same
            window: both are the same reset-safe counter reduction anchored at the
            first reading at or after `from`. A bucket such a device did not report
            in is 0, and the energy accrued meanwhile appears in the next bucket
            that has a reading. A ups_sensor has no counter, so both endpoints
            ESTIMATE its integral — the same way, per bucket here and over the
            whole window there — but they are close rather than identical. They
            differ where the load steps across a bucket boundary, by at most half
            that step times the gap between the readings straddling it, and less
            the more evenly those readings straddle it; and a
            bucket the device reported nothing in publishes 0, while the
            whole-window integral interpolates across the outage and counts it.
        cost:
          type: array
          items:
            type: number
          description: Per-bucket VAT-inclusive GBP cost, aligned to buckets.
        avg_w:
          type: array
          items:
            type: number
          description: >
            Per-bucket mean power (W); summed across members for aggregated
            groups. For counter-class devices this is the mean of the readings in
            the bucket. For a ups_sensor and for the synthetic "unmonitored"
            series it is energy-derived (kwh x 1000 / bucket hours), i.e. the
            bucket's TIME-weighted mean power, so it always agrees with the kwh
            beside it. The two coincide for a steady load on a regular cadence.
            A bucket with no telemetry reads 0; there is no "unknown" value.
        total_kwh:
          type: number
        total_cost:
          type: number
      required: [key, label, kwh, cost, avg_w, total_kwh, total_cost]

    SeriesResponse:
      type: object
      description: >
        Columnar energy time-series: a shared bucket time axis plus per-series
        value arrays that all align to it.
      properties:
        window:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        interval:
          type: string
          enum: [5m, 15m, 30m, 1h, 6h, 1d]
        group_by:
          type: string
          enum: [device, room, class, house]
        shape:
          type: string
          enum: [columns]
          description: Always "columns" for this schema.
        coverage:
          type: number
          description: >
            group_by=house only: monitored ÷ meter energy for the window (0..1).
            Omitted for other groupings and when no meter is configured. A low
            value means much of the home is unmonitored — or that monitored is
            under-counted (see stale_monitored_count).
        stale_monitored_count:
          type: integer
          description: >
            group_by=house only — including GET /devices/unmonitored/series, which
            derives its values from the house decomposition but reports group_by
            "device" and therefore omits this: count of monitored devices that
            reported NO power telemetry in the window (likely dropped/offline).
            Their load shifts
            into the "unmonitored" series, inflating it, so a non-zero value flags
            a low-confidence split. Omitted for other groupings / no meter.
            A device whose buckets came back empty counts here: an unreported
            bucket arrives from Influx as a null and is recognised as absent
            rather than as a reading of 0 W. A device that really did report 0 W
            is reporting, and is not counted.
        stale_monitored_ids:
          type: array
          items:
            type: string
          description: Ids of the stale monitored devices; omitted when none.
        buckets:
          type: array
          items:
            type: string
            format: date-time
          description: >
            Local-timezone bucket-start axis every series aligns to. Starts are
            GRID-ALIGNED — anchored at local midnight and stepped by `interval` —
            matching Influx's aggregation boundaries, so for an off-grid `from`
            the FIRST timestamp precedes `from` (e.g. from=14:29 with interval=30m
            yields a first bucket of 14:00). That bucket is a PARTIAL bucket: it is
            labelled by the grid boundary it starts on but its values cover only
            14:29 onwards, exactly as the last bucket covers only up to `to`.
            Buckets are also real wall-clock lengths, so a 1d bucket spanning a DST
            change is 23h or 25h.
        series:
          type: array
          description: >
            One entry per series in the grouping. Always an array — a grouping
            that matched nothing is [], never null, so a consumer can tell an
            empty grouping from a missing field.
          items:
            $ref: "#/components/schemas/Series"
      required: [window, from, to, interval, group_by, shape, buckets, series]

    SeriesMeta:
      type: object
      description: Per-series metadata for the row-oriented shape (no per-bucket arrays).
      properties:
        key:
          type: string
          description: >
            Series identity (device id, room id, floor id, class, the reserved
            "house" coverage key, or "monitored"/"unmonitored"/"meter"). Always an
            id — only label varies with what the floorplan publishes.
        label:
          type: string
          description: >
            Display label. For a device, its display_name (id as fallback). For a
            grouped place series (room, floor), the floorplan's NAME when it
            publishes one and the key itself otherwise — never a label derived
            from the id.
        room:
          type: string
          description: >
            Floorplan room id. Set for a per-device series (the room the device
            sits in) and for a group_by=room series (the room it IS, so it can be
            joined to GET /rooms). Empty for floor, class, and the reserved
            "house" and "unmonitored" series, which belong to no single room —
            "house" is a coverage scope that GET /rooms never lists, so it is
            never reported here as one.
        class:
          type: string
        total_kwh:
          type: number
        total_cost:
          type: number
      required: [key, label, total_kwh, total_cost]

    SeriesPoint:
      type: object
      description: One (series, bucket) sample in the row-oriented shape.
      properties:
        key:
          type: string
          description: Series identity this row belongs to.
        time:
          type: string
          format: date-time
          description: >
            Bucket start (local timezone offset). Grid-aligned, so the first row's
            time may precede `from` — see SeriesResponse.buckets.
        kwh:
          type: number
          description: >
            Energy in the part of the bucket inside [from, to). The first and last
            buckets may be partial.
        cost:
          type: number
          description: VAT-inclusive GBP cost.
        avg_w:
          type: number
          description: >
            Mean power over the in-window part of the bucket (W). Energy-derived
            (and so time-weighted) for a ups_sensor and for "unmonitored" — see
            Series.avg_w.
      required: [key, time, kwh, cost, avg_w]

    RowsResponse:
      type: object
      description: >
        Row-oriented ("tidy"/long) energy time-series: a flat list of one row per
        (series, bucket), plus lightweight per-series metadata. Rows are ordered by
        series then bucket time. Idiomatic for Codable consumers (decode the rows
        array of structs) and grouped native charts (e.g. Swift Charts).
      properties:
        window:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        interval:
          type: string
          enum: [5m, 15m, 30m, 1h, 6h, 1d]
        group_by:
          type: string
          enum: [device, room, class, house]
        shape:
          type: string
          enum: [rows]
          description: Always "rows" for this schema.
        coverage:
          type: number
          description: >
            group_by=house only: monitored ÷ meter energy for the window (0..1).
            Omitted for other groupings / no meter. See SeriesResponse.coverage.
        stale_monitored_count:
          type: integer
          description: >
            group_by=house only: count of monitored devices with no power telemetry
            in the window. See SeriesResponse.stale_monitored_count.
        stale_monitored_ids:
          type: array
          items:
            type: string
          description: Ids of the stale monitored devices; omitted when none.
        series:
          type: array
          items:
            $ref: "#/components/schemas/SeriesMeta"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/SeriesPoint"
      required: [window, from, to, interval, group_by, shape, series, rows]

    Event:
      type: object
      description: A single state transition at a point in time.
      properties:
        time:
          type: string
          format: date-time
        from:
          type: string
          description: Raw device_activity from-label (e.g. "idle").
        to:
          type: string
          description: Raw device_activity to-label (e.g. "active").
        on:
          type: boolean
          description: >
            Normalized on/off state derived from the to-label. Omitted when the
            label is not a known on/off state (a momentary/unknown event).
      required: [time, from, to]

    Interval:
      type: object
      description: A sustained ON span over the window.
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
          nullable: true
          description: End of the span, or null when still open at the window end.
        state:
          type: string
          description: Raw label of the span.
        on:
          type: boolean
        duration_s:
          type: number
          description: Window-clamped span length in seconds.
        open:
          type: boolean
          description: True when the span is still in progress at the window end.
      required: [start, state, duration_s]

    Stats:
      type: object
      description: Summary of ON intervals over the window.
      properties:
        on_count:
          type: integer
        total_on_seconds:
          type: number
        duty:
          type: number
          description: total_on_seconds divided by the window length in seconds.
      required: [on_count, total_on_seconds, duty]

    DeviceEventsResponse:
      type: object
      properties:
        device_id:
          type: string
        window:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        events:
          type: array
          items:
            $ref: "#/components/schemas/Event"
      required: [device_id, window, from, to, events]

    DeviceIntervalsResponse:
      type: object
      properties:
        device_id:
          type: string
        window:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        state_at_start:
          type: string
          description: Raw carry-in state the device was in as the window opened.
        intervals:
          type: array
          items:
            $ref: "#/components/schemas/Interval"
        stats:
          $ref: "#/components/schemas/Stats"
      required: [device_id, window, from, to, state_at_start, intervals, stats]

    EventSeries:
      type: object
      description: One multi-device /events series (per device or per class).
      properties:
        key:
          type: string
          description: Series identity (device id or class).
        label:
          type: string
        class:
          type: string
        events:
          type: array
          items:
            $ref: "#/components/schemas/Event"
      required: [key, label, class, events]

    EventsResponse:
      type: object
      description: Columnar multi-device event overlay.
      properties:
        window:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        group_by:
          type: string
          enum: [device, class]
        series:
          type: array
          items:
            $ref: "#/components/schemas/EventSeries"
      required: [window, from, to, group_by, series]

    DeviceCatalogEntry:
      type: object
      description: One device catalog row.
      properties:
        id:
          type: string
        display_name:
          type: string
        room:
          type: string
          description: >
            Floorplan room id. Empty for a device whose readings describe the whole
            property rather than a room; see covers.
        floor:
          type: string
          description: >
            Floor id as DECLARED by the devices namespace, e.g. "floor2". Empty
            when the namespace declares none — never derived from the room id's
            "<floor>.<slug>" shape, since the floorplan owns that fact. Join to
            /floors for its name, storey order and elevation.
        covers:
          type: string
          description: >
            Set when the device's readings describe the whole property rather than
            the room it sits in, which is why its room may be empty.
        class:
          type: string
        capabilities:
          type: array
          items:
            type: string
            enum: [energy, events]
          description: Derived capability hints ("energy" for metered classes, "events" for event-bearing classes — binary_state_device, fire_alarm).
      required: [id, display_name, room, floor, class, capabilities]

    DevicesCatalog:
      type: object
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/DeviceCatalogEntry"
      required: [devices]

    FloorCatalogEntry:
      type: object
      description: One floor catalog row.
      properties:
        id:
          type: string
          description: Floor id — the value to pass back as floors=, and the value devices carry in their `floor` property.
          example: floor1
        name:
          type: string
          description: >
            The floorplan's display label, empty when it declares none. Reported
            empty rather than title-cased from the id.
          example: Floor One
        order:
          type: integer
          nullable: true
          description: >
            Storey position, ascending from the lowest. NULL when the floorplan
            declares none — nullable rather than defaulted because 0 is a
            legitimate order (a basement), so it cannot double as "undeclared".
            Floor ids do not sort into building order, so without this every
            client hardcodes its own storey sequence.
          example: 1
        elevation:
          type: number
          format: double
          nullable: true
          description: Metres above the site datum, null when undeclared (0.0 is a real elevation).
          example: 0.0
        device_count:
          type: integer
          description: Metered devices declaring this floor. Always >= 1 — a floor with none is not listed.
      required: [id, name, order, elevation, device_count]

    FloorsCatalog:
      type: object
      properties:
        floors:
          type: array
          items:
            $ref: "#/components/schemas/FloorCatalogEntry"
      required: [floors]

    RoomCatalogEntry:
      type: object
      description: One room catalog row.
      properties:
        id:
          type: string
          description: >
            Floorplan room id — the value to pass back as rooms=, and the value
            devices carry in their `room` property. It is the key: NAMES ARE NOT
            UNIQUE, since two rooms on different floors may share one.
          example: floor1.room-a
        name:
          type: string
          description: The floorplan's display label, empty when it declares none.
          example: Room A
        floor:
          type: string
          description: >
            Floor id the floorplan puts this room on, empty when it declares
            none. Relayed from the ROOM record — never read out of the id's
            "<floor>.<slug>" shape, and never inferred from the floors this
            room's devices declare. NOT guaranteed to appear in /floors: that
            listing is built from the floors DEVICES declare, and countinghouse
            does not arbitrate between two upstream declarations. A client
            joining the two must handle a miss.
          example: floor1
        category:
          type: string
          description: >
            The room's purpose as the floorplan classifies it (e.g. "kitchen",
            "circulation", "plant"), empty when it declares none. Relayed raw and
            deliberately not reduced to a computed flag: which rooms "count" is a
            per-dashboard policy question, and a breakdown, a coverage view and a
            heat-loss view answer it differently.
          example: utility
        area:
          type: number
          format: double
          nullable: true
          description: Floor area in square metres, null when undeclared.
          example: 12.4
        device_count:
          type: integer
          description: Metered devices attributed to this room. Always >= 1 — a room with none is not listed.
      required: [id, name, floor, category, area, device_count]

    RoomsCatalog:
      type: object
      properties:
        rooms:
          type: array
          items:
            $ref: "#/components/schemas/RoomCatalogEntry"
      required: [rooms]

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded, unavailable]
          description: >-
            Aggregated downstream verdict. ok = all downstreams healthy;
            degraded = serving last-known-good config because a remote-config
            fetch is failing (remote_config.*.ok = false); unavailable = Influx
            is unreachable (data routes will 502). The HTTP status is 200 in all
            three cases — /healthz reports health, it does not itself fail.
            On a running instance, degraded always means STALE and never EMPTY: a
            namespace that has never been fetched aborts startup instead, so any
            snapshot being served has landed at least once.
          example: ok
        version:
          type: string
        started_at:
          type: string
          format: date-time
        started_ago:
          type: integer
          description: Seconds since the server started.
        goroutines:
          type: integer
        influx_reachable:
          type: boolean
        site:
          type: object
          description: >-
            The site config this instance resolved: which property it serves and
            where it reads that property's devices from. Omitted on an instance
            that predates the per-site split, which is not a fault.
          properties:
            id:
              type: string
              example: home
            devices_namespace:
              type: string
              example: devices_home
            floorplan_namespace:
              type: string
              description: >-
                The floorplan namespace (floors, rooms) this instance reads. Like
                devices_namespace it is required, so a running instance always has
                one. Reported so an operator can see which property's floorplan it
                serves, and so blank names are attributable — remote_config cannot
                draw that distinction, since it only records the outcome of a
                fetch.
              example: floorplan_home
        remote_config:
          type: object
          description: >-
            Per-namespace status of the most recent remote-config fetch, keyed by
            the namespace actually read. The devices key follows
            site.devices_namespace, which is required — there is no default, and a
            config naming no namespace refuses to start. A monitor keyed on a
            literal namespace therefore stops matching when a site migrates, and a
            missing key reads as healthy in most check expressions. Alert on the
            top-level `status` field instead, which degrades regardless of the key.
            `energy_tariffs` is fixed, and the floorplan key follows
            `site.floorplan_namespace`, which is required too. Omitted when no
            remote-config fetcher is wired.
          additionalProperties:
            type: object
            properties:
              ok:
                type: boolean
              fetched_at:
                type: string
                format: date-time
              error:
                type: string
      required: [status, started_at, started_ago, goroutines, influx_reachable]
